<body class="bg-slate-50 text-slate-800">
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useMemo, useEffect, useRef } = React;

    const STORAGE_KEY = 'household_asset_platform_v2';
    const IDB_NAME = 'HouseholdAssetPlatformDB';
    const IDB_STORE = 'appStateStore';
    const IDB_RECORD_KEY = 'latest_state';

    function saveToIndexedDB(payload, onError) {
      try {
        if (typeof window === 'undefined' || !window.indexedDB) {
          if (onError) onError('このブラウザ環境ではIndexedDBが利用できません（localStorageのみ使用）。');
          return;
        }
        const req = window.indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(IDB_STORE)) {
            db.createObjectStore(IDB_STORE);
          }
        };
        req.onsuccess = (e) => {
          try {
            const db = e.target.result;
            const tx = db.transaction(IDB_STORE, 'readwrite');
            tx.onerror = () => {
              if (onError) onError('IndexedDBへの保存トランザクションに失敗しました。');
            };
            tx.objectStore(IDB_STORE).put(payload, IDB_RECORD_KEY);
          } catch (innerErr) {
            if (onError) onError(`IndexedDB保存エラー: ${innerErr?.message || '不明'}`);
          }
        };
        req.onerror = () => {
          if (onError) onError('IndexedDBのオープンに失敗しました。');
        };
      } catch (err) {
        if (onError) onError(`IndexedDB例外: ${err?.message || '不明'}`);
      }
    }

    function loadFromIndexedDB(callback, onError) {
      try {
        if (typeof window === 'undefined' || !window.indexedDB) return;
        const req = window.indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(IDB_STORE)) {
            db.createObjectStore(IDB_STORE);
          }
        };
        req.onsuccess = (e) => {
          try {
            const db = e.target.result;
            const tx = db.transaction(IDB_STORE, 'readonly');
            const getReq = tx.objectStore(IDB_STORE).get(IDB_RECORD_KEY);
            getReq.onsuccess = () => {
              if (getReq.result) callback(getReq.result);
            };
            getReq.onerror = () => {
              if (onError) onError('IndexedDBからのデータ読み込みに失敗しました。');
            };
          } catch (innerErr) {
            if (onError) onError(`IndexedDB読込エラー: ${innerErr?.message || '不明'}`);
          }
        };
        req.onerror = () => {
          if (onError) onError('IndexedDB接続エラーが発生しました。');
        };
      } catch (err) {
        if (onError) onError(`IndexedDB読込例外: ${err?.message || '不明'}`);
      }
    }

    function getJstDateString() {
      try {
        const formatter = new Intl.DateTimeFormat('ja-JP', {
          timeZone: 'Asia/Tokyo',
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
        });
        const parts = formatter.formatToParts(new Date());
        const y = parts.find((p) => p.type === 'year')?.value;
        const m = parts.find((p) => p.type === 'month')?.value;
        const d = parts.find((p) => p.type === 'day')?.value;
        if (y && m && d) return `${y}-${m}-${d}`;
      } catch (e) {
        // fallback
      }
      const jst = new Date(Date.now() + 9 * 60 * 60 * 1000);
      return jst.toISOString().slice(0, 10);
    }

    const INITIAL_ASSETS = [];
    const INITIAL_PAST_HISTORY = [];

    const INITIAL_BUDGET = {
      monthlyIncome: 550000,
      monthlyLivingCost: 320000,
      annualBonus: 1000000,
      annualExtraSavings: 200000,
    };

    const INITIAL_PROFILE = {
      currentAge: 34,
      simulationYears: 30,
      defaultReturnRate: 0.035,
      inflationRate: 0.01,
    };

    const INITIAL_LIFE_EVENTS = [];

    const INITIAL_HOUSING_SIM = {
      propertyPrice: 50000000,
      downPayment: 5000000,
      closingCosts: 2500000,
      interestRate: 0.008,
      loanYears: 35,
      annualMaintenance: 200000,
      expectedAppreciationRate: -0.01,
    };

    const INITIAL_EDUCATION_SIM = {
      childAge: 2,
      kindergartenType: 'public',
      schoolType: 'public',
      universityType: 'science',
    };

    function generateDeterministicId(prefix, rawKey) {
      const normalized = String(rawKey || 'unknown').trim().toLowerCase();
      let hash = 0;
      for (let i = 0; i < normalized.length; i++) {
        hash = (hash * 31 + normalized.charCodeAt(i)) >>> 0;
      }
      return `${prefix}_${hash.toString(36)}`;
    }

    function migrateHierarchyData(rawAssets, existingInstitutions = [], existingAccounts = []) {
      try {
        if (!Array.isArray(rawAssets)) {
          return {
            institutions: Array.isArray(existingInstitutions) ? existingInstitutions : [],
            accounts: Array.isArray(existingAccounts) ? existingAccounts : [],
            assets: [],
            migrated: false,
          };
        }

        const instMap = new Map();
        if (Array.isArray(existingInstitutions)) {
          existingInstitutions.forEach((inst) => {
            if (inst && inst.id) {
              instMap.set(inst.id, { ...inst });
            }
          });
        }

        const accMap = new Map();
        if (Array.isArray(existingAccounts)) {
          existingAccounts.forEach((acc) => {
            if (acc && acc.id) {
              accMap.set(acc.id, { ...acc });
            }
          });
        }

        const migratedAssets = rawAssets.map((asset) => {
          if (!asset || typeof asset !== 'object') return asset;

          const instName = (asset.institution || 'その他金融機関').trim();
          const accType = (asset.accountType || (asset.isLiability ? 'ローン' : '普通預金')).trim();

          let instId = asset.institutionId;
          if (!instId || !instMap.has(instId)) {
            const foundByName = Array.from(instMap.values()).find((i) => i.name === instName);
            if (foundByName) {
              instId = foundByName.id;
            } else {
              instId = generateDeterministicId('inst', instName);
              if (!instMap.has(instId)) {
                instMap.set(instId, {
                  id: instId,
                  name: instName,
                  type: instName.includes('証券') ? 'securities' : 'bank',
                });
              }
            }
          }

          let accId = asset.accountId;
          if (!accId || !accMap.has(accId)) {
            const foundAcc = Array.from(accMap.values()).find(
              (a) => a.institutionId === instId && a.accountType === accType
            );
            if (foundAcc) {
              accId = foundAcc.id;
            } else {
              accId = generateDeterministicId('acc', `${instId}_${accType}`);
              if (!accMap.has(accId)) {
                const isLiab = Boolean(asset.isLiability || asset.category === 'liability' || accType === 'ローン');
                accMap.set(accId, {
                  id: accId,
                  institutionId: instId,
                  name: `${instName} ${accType}`,
                  accountType: accType,
                  category: isLiab ? 'liability' : asset.category || 'cash',
                  isLiability: isLiab,
                  openedDate: null,
                  closedDate: null,
                });
              }
            }
          }

          const resolvedInst = instMap.get(instId);
          const resolvedAcc = accMap.get(accId);
          const effectiveIsLiability = resolvedAcc ? Boolean(resolvedAcc.isLiability) : Boolean(asset.isLiability);

          return {
            ...asset,
            id: asset.id ? String(asset.id) : `asset_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
            institutionId: instId,
            accountId: accId,
            institution: resolvedInst ? resolvedInst.name : instName,
            accountType: resolvedAcc ? resolvedAcc.accountType : accType,
            isLiability: effectiveIsLiability,
            quantity: asset.quantity !== undefined ? asset.quantity : null,
          };
        });

        return {
          institutions: Array.from(instMap.values()),
          accounts: Array.from(accMap.values()),
          assets: migratedAssets,
          migrated: true,
        };
      } catch (err) {
        return {
          institutions: Array.isArray(existingInstitutions) ? existingInstitutions : [],
          accounts: Array.isArray(existingAccounts) ? existingAccounts : [],
          assets: Array.isArray(rawAssets) ? rawAssets : [],
          migrated: false,
        };
      }
    }

    function normalizeStateObject(saved) {
      const rawAssetsCount = Array.isArray(saved?.assets) ? saved.assets.length : 0;
      const rawPastCount = Array.isArray(saved?.pastHistory) ? saved.pastHistory.length : 0;
      const rawSnapCount = Array.isArray(saved?.accountSnapshots) ? saved.accountSnapshots.length : 0;
      const rawTransferCount = Array.isArray(saved?.transfers) ? saved.transfers.length : 0;

      const baseAssets = saved && Array.isArray(saved.assets) ? saved.assets : INITIAL_ASSETS;
      const baseInstitutions = Array.isArray(saved?.institutions) ? saved.institutions : [];
      const baseAccounts = Array.isArray(saved?.accounts) ? saved.accounts : [];
      const migrated = migrateHierarchyData(baseAssets, baseInstitutions, baseAccounts);

      const normalizedSnapshots = Array.isArray(saved?.accountSnapshots)
        ? saved.accountSnapshots
            .filter(
              (s) =>
                s &&
                typeof s === 'object' &&
                s.accountId &&
                s.date &&
                s.accountTotalAmount !== null &&
                s.accountTotalAmount !== undefined &&
                !Number.isNaN(Number(s.accountTotalAmount))
            )
            .map((s) => ({
              ...s,
              itemsMode: s.itemsMode === 'partial' ? 'partial' : 'full',
              items: Array.isArray(s.items)
                ? s.items.map((it) => ({
                    assetId: it.assetId || null,
                    name: String(it.name || ''),
                    amount: Number(it.amount || 0),
                    tags: Array.isArray(it.tags) ? [...it.tags] : null,
                    category: it.category || null,
                    isLiability: it.isLiability !== undefined ? Boolean(it.isLiability) : null,
                  }))
                : [],
            }))
        : [];

      const normalizedTransfers = Array.isArray(saved?.transfers)
        ? saved.transfers.filter(
            (t) => t && typeof t === 'object' && t.id && t.date && t.transferType && !Number.isNaN(Number(t.amount))
          )
        : [];

      return {
        institutions: migrated.institutions,
        accounts: migrated.accounts,
        assets: migrated.assets,
        pastHistory: Array.isArray(saved?.pastHistory) ? saved.pastHistory : INITIAL_PAST_HISTORY,
        accountSnapshots: normalizedSnapshots,
        transfers: normalizedTransfers,
        budget: saved?.budget && typeof saved.budget === 'object' ? { ...INITIAL_BUDGET, ...saved.budget } : INITIAL_BUDGET,
        profile: saved?.profile && typeof saved.profile === 'object' ? { ...INITIAL_PROFILE, ...saved.profile } : INITIAL_PROFILE,
        lifeEvents: Array.isArray(saved?.lifeEvents) ? saved.lifeEvents : INITIAL_LIFE_EVENTS,
        housingSim: saved?.housingSim && typeof saved.housingSim === 'object' ? { ...INITIAL_HOUSING_SIM, ...saved.housingSim } : INITIAL_HOUSING_SIM,
        educationSim: saved?.educationSim && typeof saved.educationSim === 'object' ? { ...INITIAL_EDUCATION_SIM, ...saved.educationSim } : INITIAL_EDUCATION_SIM,
        updatedAtJst: saved?.updatedAtJst || null,
        migrationReport: {
          before: {
            assets: rawAssetsCount,
            pastHistory: rawPastCount,
            accountSnapshots: rawSnapCount,
            transfers: rawTransferCount,
          },
          after: {
            institutions: migrated.institutions.length,
            accounts: migrated.accounts.length,
            assets: migrated.assets.length,
            pastHistory: Array.isArray(saved?.pastHistory) ? saved.pastHistory.length : 0,
            accountSnapshots: normalizedSnapshots.length,
            transfers: normalizedTransfers.length,
          },
        },
      };
    }

    function validateBackupPayload(parsed) {
      if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) {
        return { valid: false, error: 'JSONのルートがオブジェクト形式ではありません。' };
      }
      const hasKnownKey =
        Array.isArray(parsed.assets) ||
        Array.isArray(parsed.accountSnapshots) ||
        Array.isArray(parsed.pastHistory) ||
        Array.isArray(parsed.accounts);

      if (!hasKnownKey) {
        return { valid: false, error: '資産データ・口座データ・履歴データのいずれも含まれていない不正なJSONです。' };
      }
      if (parsed.assets !== undefined && !Array.isArray(parsed.assets)) {
        return { valid: false, error: 'assets フィールドが配列形式ではありません。' };
      }
      if (parsed.accountSnapshots !== undefined && !Array.isArray(parsed.accountSnapshots)) {
        return { valid: false, error: 'accountSnapshots フィールドが配列形式ではありません。' };
      }
      return { valid: true };
    }

    function loadInitialAppState() {
      let saved = null;
      let loadError = null;
      try {
        if (typeof window !== 'undefined' && window.localStorage) {
          const raw = window.localStorage.getItem(STORAGE_KEY);
          if (raw) {
            saved = JSON.parse(raw);
          }
        }
      } catch (e) {
        saved = null;
        loadError = `localStorageの読み込みに失敗しました（${e?.message || 'JSON破損'}）。バックアップからの復元をご検討ください。`;
      }
      const normalized = normalizeStateObject(saved);
      return { ...normalized, loadError, hasSavedData: Boolean(saved) };
    }

    const SERIES_COLORS = ['#4f46e5', '#10b981', '#0ea5e9', '#f59e0b', '#ec4899', '#8b5cf6', '#14b8a6', '#f43f5e', '#6366f1', '#84cc16'];

    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [donutMode, setDonutMode] = useState('institution');
      const [drillFilter, setDrillFilter] = useState(null);
      const [showMultiScenario, setShowMultiScenario] = useState(true);

      const initialData = useMemo(() => loadInitialAppState(), []);
      const isFirstRenderRef = useRef(true);

      const [pastHistory, setPastHistory] = useState(initialData.pastHistory);
      const [institutions, setInstitutions] = useState(initialData.institutions);
      const [accounts, setAccounts] = useState(initialData.accounts);
      const [assets, setAssets] = useState(initialData.assets);
      const [accountSnapshots, setAccountSnapshots] = useState(initialData.accountSnapshots);
      const [transfers, setTransfers] = useState(initialData.transfers);
      const [budget, setBudget] = useState(initialData.budget);
      const [profile, setProfile] = useState(initialData.profile);
      const [lifeEvents, setLifeEvents] = useState(initialData.lifeEvents);
      const [housingSim, setHousingSim] = useState(initialData.housingSim);
      const [educationSim, setEducationSim] = useState(initialData.educationSim);

      const [storageWarning, setStorageWarning] = useState(initialData.loadError || '');
      const [lastSavedStatus, setLastSavedStatus] = useState(
        initialData.hasSavedData
          ? `端末内データを読み込みました（資産${initialData.assets.length}件・履歴${initialData.accountSnapshots.length}件）`
          : '新規データ状態で起動しました（初回空状態）'
      );
      const [lastMigrationReport, setLastMigrationReport] = useState(
        initialData.hasSavedData ? initialData.migrationReport : null
      );

      useEffect(() => {
        const hasLocal = typeof window !== 'undefined' && window.localStorage && window.localStorage.getItem(STORAGE_KEY);
        if (!hasLocal) {
          loadFromIndexedDB(
            (idbSaved) => {
              if (idbSaved && typeof idbSaved === 'object') {
                const restored = normalizeStateObject(idbSaved);
                setInstitutions(restored.institutions);
                setAccounts(restored.accounts);
                setAssets(restored.assets);
                setPastHistory(restored.pastHistory);
                setAccountSnapshots(restored.accountSnapshots);
                setTransfers(restored.transfers);
                setBudget(restored.budget);
                setProfile(restored.profile);
                setLifeEvents(restored.lifeEvents);
                setHousingSim(restored.housingSim);
                setEducationSim(restored.educationSim);
                setLastMigrationReport(restored.migrationReport);
                setLastSavedStatus(
                  `IndexedDBから自動復元しました（資産${restored.assets.length}件・履歴${restored.accountSnapshots.length}件）`
                );
              }
            },
            (errMsg) => setStorageWarning(errMsg)
          );
        }
      }, []);

      useEffect(() => {
        if (isFirstRenderRef.current) {
          isFirstRenderRef.current = false;
          return;
        }
        const payload = {
          schemaVersion: 5,
          updatedAtJst: getJstDateString(),
          institutions,
          accounts,
          assets,
          pastHistory,
          accountSnapshots,
          transfers,
          budget,
          profile,
          lifeEvents,
          housingSim,
          educationSim,
        };
        let localOk = false;
        try {
          if (typeof window !== 'undefined' && window.localStorage) {
            window.localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
            localOk = true;
          } else {
            setStorageWarning('localStorageが利用できない環境です。JSONバックアップでの保存を推奨します。');
          }
        } catch (e) {
          setStorageWarning(`端末内保存（localStorage）に失敗しました: ${e?.message || '容量超過または制限'}`);
        }

        saveToIndexedDB(payload, (idbErr) => {
          setStorageWarning((prev) => (prev ? `${prev} / ${idbErr}` : idbErr));
        });

        if (localOk) {
          setLastSavedStatus(`自動保存完了 (${getJstDateString()} JST)`);
        }
      }, [
        institutions,
        accounts,
        assets,
        pastHistory,
        accountSnapshots,
        transfers,
        budget,
        profile,
        lifeEvents,
        housingSim,
        educationSim,
      ]);

      // モーダル・入力状態
      const [modalType, setModalType] = useState(null);
      const [newAsset, setNewAsset] = useState({
        name: '',
        accountId: initialData.accounts[0]?.id || '',
        category: 'cash',
        tagsInput: '貯蓄用',
        principal: '',
        amount: '',
      });

      const [isCreatingInlineAccount, setIsCreatingInlineAccount] = useState(false);
      const [inlineInstMode, setInlineInstMode] = useState('existing');
      const [inlineInstId, setInlineInstId] = useState(initialData.institutions[0]?.id || '');
      const [inlineNewInstName, setInlineNewInstName] = useState('');
      const [inlineNewAccName, setInlineNewAccName] = useState('');
      const [inlineNewAccType, setInlineNewAccType] = useState('普通預金');
      const [inlineNewAccIsLiability, setInlineNewAccIsLiability] = useState(false);

      const [editingInstId, setEditingInstId] = useState(null);
      const [editingInstName, setEditingInstName] = useState('');
      const [editingAccId, setEditingAccId] = useState(null);
      const [editingAccName, setEditingAccName] = useState('');
      const [managerNewInstName, setManagerNewInstName] = useState('');
      const [managerNewAccInstId, setManagerNewAccInstId] = useState(initialData.institutions[0]?.id || '');
      const [managerNewAccName, setManagerNewAccName] = useState('');
      const [managerNewAccType, setManagerNewAccType] = useState('普通預金');
      const [managerNewAccIsLiability, setManagerNewAccIsLiability] = useState(false);

      // 口座残高スナップショット関連
      const [snapshotAccountFilter, setSnapshotAccountFilter] = useState('all');
      const [batchDate, setBatchDate] = useState(() => getJstDateString());
      const [batchEntries, setBatchEntries] = useState({});
      const [batchUpdateCurrentAssets, setBatchUpdateCurrentAssets] = useState(false);
      const [batchFeedback, setBatchFeedback] = useState('');
      const [editingSnapshot, setEditingSnapshot] = useState(null);

      // 6軸推移分析状態
      const [trendDimension, setTrendDimension] = useState('account');
      const [trendRange, setTrendRange] = useState('1y');
      const [customStartDate, setCustomStartDate] = useState('');
      const [customEndDate, setCustomEndDate] = useState('');

      const [selectedTrendAccountIds, setSelectedTrendAccountIds] = useState(() =>
        initialData.accounts.slice(0, 3).map((a) => a.id)
      );
      const [selectedTrendInstIds, setSelectedTrendInstIds] = useState(() =>
        initialData.institutions.slice(0, 3).map((i) => i.id)
      );
      const [selectedTrendItemIds, setSelectedTrendItemIds] = useState(() =>
        initialData.assets.slice(0, 3).map((a) => a.id)
      );
      const [selectedTrendTags, setSelectedTrendTags] = useState(() => []);
      const [selectedTrendCategories, setSelectedTrendCategories] = useState(() => ['cash', 'investment', 'pension']);
      const [selectedTrendLiabModes, setSelectedTrendLiabModes] = useState(() => ['totalAssets', 'netWorth', 'totalLiabilities']);
      const [selectedTrendDateIdx, setSelectedTrendDateIdx] = useState(0);

      // 資金移動フォーム
      const [editingTransferId, setEditingTransferId] = useState(null);
      const [transferForm, setTransferForm] = useState({
        date: getJstDateString(),
        transferType: 'internal',
        fromAccountId: initialData.accounts[0]?.id || '',
        toAccountId: initialData.accounts[1]?.id || initialData.accounts[0]?.id || '',
        amount: '',
        note: '',
      });

      const [newHistory, setNewHistory] = useState({ label: '2022年', yearsAgo: 4, amount: '', principal: '', cash: '' });
      const [newEvent, setNewEvent] = useState({ name: '', type: 'housing', age: 36, cost: '', downPayment: '', monthlyLoanPayment: '' });
      const [selectedPointIndex, setSelectedPointIndex] = useState(0);
      const [backupText, setBackupText] = useState('');
      const [statusMessage, setStatusMessage] = useState('');
      const [pendingRestorePreview, setPendingRestorePreview] = useState(null);

      // 住宅ローン試算
      const calculatedHousingResult = useMemo(() => {
        const loanAmount = Math.max(0, housingSim.propertyPrice - housingSim.downPayment);
        const monthlyRate = housingSim.interestRate / 12;
        const totalMonths = Math.max(1, housingSim.loanYears * 12);
        let monthlyPayment = 0;
        if (monthlyRate > 0) {
          monthlyPayment = (loanAmount * monthlyRate * Math.pow(1 + monthlyRate, totalMonths)) / (Math.pow(1 + monthlyRate, totalMonths) - 1);
        } else {
          monthlyPayment = loanAmount / totalMonths;
        }
        const totalPayment = monthlyPayment * totalMonths;
        const totalInterest = totalPayment - loanAmount;
        const initialCashOut = housingSim.downPayment + housingSim.closingCosts;
        return {
          loanAmount,
          monthlyPayment: Math.round(monthlyPayment),
          totalPayment: Math.round(totalPayment),
          totalInterest: Math.round(totalInterest),
          initialCashOut,
        };
      }, [housingSim]);

      // 教育費試算
      const calculatedEducationResult = useMemo(() => {
        const costs = {
          kindergarten: educationSim.kindergartenType === 'private' ? 1500000 : 600000,
          elementary: educationSim.schoolType === 'private' ? 6000000 : 2000000,
          juniorHigh: educationSim.schoolType === 'private' ? 4200000 : 1500000,
          highSchool: educationSim.schoolType === 'private' ? 3000000 : 1300000,
          university:
            educationSim.universityType === 'science'
              ? 6000000
              : educationSim.universityType === 'private-arts'
              ? 7000000
              : educationSim.universityType === 'private-science'
              ? 9000000
              : 4500000,
        };
        const totalEduCost = Object.values(costs).reduce((a, b) => a + b, 0);
        return { costs, totalEduCost };
      }, [educationSim]);

      // 総資産・負債・純資産計算
      const summaryStats = useMemo(() => {
        const accMap = new Map(accounts.map((acc) => [acc.id, acc]));
        const isAssetLiability = (a) => {
          const acc = a.accountId ? accMap.get(a.accountId) : null;
          return acc ? Boolean(acc.isLiability) : Boolean(a.isLiability);
        };

        const positiveAssets = assets.filter((a) => !isAssetLiability(a));
        const liabilities = assets.filter((a) => isAssetLiability(a));

        const totalAssets = positiveAssets.reduce((sum, item) => sum + Number(item.amount || 0), 0);
        const totalLiabilities = liabilities.reduce((sum, item) => sum + Number(item.amount || 0), 0);
        const netWorth = totalAssets - totalLiabilities;

        const totalPrincipal = positiveAssets.reduce((sum, item) => sum + Number(item.principal ?? item.amount ?? 0), 0);
        const unrealizedGain = totalAssets - totalPrincipal;

        const cashAssets = positiveAssets
          .filter((a) => a.category === 'cash')
          .reduce((sum, item) => sum + Number(item.amount || 0), 0);
        const riskAssets = totalAssets - cashAssets;
        const cashRatio = totalAssets > 0 ? (cashAssets / totalAssets) * 100 : 0;
        const riskRatio = totalAssets > 0 ? (riskAssets / totalAssets) * 100 : 0;

        return {
          totalAssets,
          totalLiabilities,
          netWorth,
          totalPrincipal,
          unrealizedGain,
          cashAssets,
          riskAssets,
          cashRatio,
          riskRatio,
        };
      }, [assets, accounts]);

      // 資金移動サマリー
      const transferSummary = useMemo(() => {
        let internalTotal = 0;
        let externalInTotal = 0;
        let externalOutTotal = 0;
        transfers.forEach((t) => {
          const amt = Number(t.amount || 0);
          if (t.transferType === 'internal') internalTotal += amt;
          else if (t.transferType === 'external_in') externalInTotal += amt;
          else if (t.transferType === 'external_out') externalOutTotal += amt;
        });
        return { internalTotal, externalInTotal, externalOutTotal, netExternalFlow: externalInTotal - externalOutTotal };
      }, [transfers]);

      // 過去分析
      const pastAnalysis = useMemo(() => {
        const sorted = [...pastHistory].sort((a, b) => a.ageOffset - b.ageOffset);
        const timeline = [
          ...sorted.map((h) => ({
            label: h.label,
            ageOffset: h.ageOffset,
            amount: Number(h.amount || 0),
            principal: h.principal !== undefined && h.principal !== '' && h.principal !== null ? Number(h.principal) : null,
            cash: h.cash !== undefined && h.cash !== '' && h.cash !== null ? Number(h.cash) : null,
          })),
          {
            label: '現在',
            ageOffset: 0,
            amount: summaryStats.totalAssets,
            principal: summaryStats.totalPrincipal,
            cash: summaryStats.cashAssets,
          },
        ];

        let cagr = null;
        if (timeline.length >= 2) {
          const oldest = timeline[0];
          const latest = timeline[timeline.length - 1];
          const spanYears = Math.abs(oldest.ageOffset);
          if (oldest.amount > 0 && spanYears > 0) {
            cagr = (Math.pow(latest.amount / oldest.amount, 1 / spanYears) - 1) * 100;
          }
        }

        const yearlyChanges = [];
        for (let i = 1; i < timeline.length; i++) {
          const prev = timeline[i - 1];
          const curr = timeline[i];
          const totalDiff = curr.amount - prev.amount;
          const diffRate = prev.amount > 0 ? (totalDiff / prev.amount) * 100 : 0;

          let netInflow = null;
          let marketGain = null;
          if (prev.principal !== null && curr.principal !== null) {
            netInflow = curr.principal - prev.principal;
            marketGain = totalDiff - netInflow;
          }

          yearlyChanges.push({
            period: `${prev.label} → ${curr.label}`,
            toLabel: curr.label,
            totalDiff,
            diffRate,
            netInflow,
            marketGain,
          });
        }

        const ranking = [...yearlyChanges].sort((a, b) => b.totalDiff - a.totalDiff);
        return { timeline, cagr, yearlyChanges, ranking };
      }, [pastHistory, summaryStats]);

      function getCategoryLabel(cat) {
        if (cat === 'cash') return '現金・預金';
        if (cat === 'investment') return '投資信託・株式';
        if (cat === 'pension') return '年金・iDeCo';
        if (cat === 'liability') return '負債・ローン';
        return 'その他資産';
      }

      // ドーナツグラフ用データ集計
      const donutData = useMemo(() => {
        const instMap = new Map(institutions.map((i) => [i.id, i]));
        const accMap = new Map(accounts.map((a) => [a.id, a]));
        const isAssetLiability = (a) => {
          const acc = a.accountId ? accMap.get(a.accountId) : null;
          return acc ? Boolean(acc.isLiability) : Boolean(a.isLiability);
        };

        const positiveAssets = assets.filter((a) => !isAssetLiability(a));
        const filtered = drillFilter
          ? positiveAssets.filter((a) => {
              if (drillFilter.mode === 'institution') {
                return drillFilter.id ? a.institutionId === drillFilter.id : a.institution === drillFilter.value;
              }
              if (drillFilter.mode === 'account') {
                return drillFilter.id ? a.accountId === drillFilter.id : a.accountType === drillFilter.value;
              }
              if (drillFilter.mode === 'category') return getCategoryLabel(a.category) === drillFilter.value;
              if (drillFilter.mode === 'tag') return (a.tags || []).includes(drillFilter.value);
              return true;
            })
          : positiveAssets;

        const activeMode = drillFilter
          ? drillFilter.mode === 'institution'
            ? 'account'
            : 'item'
          : donutMode;

        const map = {};
        const idLookup = {};
        let baseSum = 0;

        filtered.forEach((a) => {
          const val = Number(a.amount || 0);
          const instObj = a.institutionId ? instMap.get(a.institutionId) : null;
          const accObj = a.accountId ? accMap.get(a.accountId) : null;

          if (activeMode === 'tag') {
            const tags = a.tags && a.tags.length > 0 ? a.tags : ['未分類'];
            tags.forEach((t) => {
              map[t] = (map[t] || 0) + val;
              baseSum += val;
            });
          } else {
            let key = a.name;
            let itemId = null;
            if (activeMode === 'institution') {
              key = instObj ? instObj.name : a.institution || 'その他';
              itemId = instObj ? instObj.id : null;
            } else if (activeMode === 'account') {
              key = accObj ? accObj.name : a.accountType || '普通預金';
              itemId = accObj ? accObj.id : null;
            } else if (activeMode === 'category') {
              key = getCategoryLabel(a.category);
            }

            map[key] = (map[key] || 0) + val;
            if (itemId) idLookup[key] = itemId;
            baseSum += val;
          }
        });

        const palette = SERIES_COLORS;
        return Object.keys(map)
          .map((key) => ({
            name: key,
            id: idLookup[key] || null,
            amount: map[key],
            ratio: baseSum > 0 ? (map[key] / baseSum) * 100 : 0,
          }))
          .sort((a, b) => b.amount - a.amount)
          .map((item, idx) => ({ ...item, color: palette[idx % palette.length] }));
      }, [assets, institutions, accounts, donutMode, drillFilter]);

      const lastPastRecord = useMemo(() => {
        if (pastHistory.length === 0) return null;
        const sorted = [...pastHistory].sort((a, b) => a.ageOffset - b.ageOffset);
        return sorted[sorted.length - 1];
      }, [pastHistory]);

      const annualNetSavings = useMemo(() => {
        return Number(budget.monthlyIncome) * 12 + Number(budget.annualBonus) - Number(budget.monthlyLivingCost) * 12 + Number(budget.annualExtraSavings);
      }, [budget]);

      // 将来推移計算
      const runScenarioProjection = (returnRate) => {
        const years = profile.simulationYears;
        let currentWealth = summaryStats.totalAssets;
        const result = [];
        let activeMortgages = [];
        const currentCalendarYear = new Date().getFullYear();

        for (let i = 0; i <= years; i++) {
          const age = profile.currentAge + i;
          const calendarYear = currentCalendarYear + i;

          if (i > 0) {
            const inflationDrag = Number(budget.monthlyLivingCost) * 12 * (Math.pow(1 + (profile.inflationRate || 0), i) - 1);
            const adjustedSavings = annualNetSavings - inflationDrag;

            currentWealth = (currentWealth + adjustedSavings) * (1 + returnRate);
            let mortgageDeduction = 0;
            activeMortgages = activeMortgages.filter((m) => {
              if (m.remainingYears > 0) {
                mortgageDeduction += m.monthlyPayment * 12;
                m.remainingYears -= 1;
                return true;
              }
              return false;
            });
            currentWealth -= mortgageDeduction;
          }

          let eventCostThisYear = 0;
          const eventNames = [];

          lifeEvents.forEach((ev) => {
            if (ev.enabled && Number(ev.age) === age) {
              eventNames.push(ev.name);
              if (ev.type === 'housing') {
                eventCostThisYear += Number(ev.downPayment || 0);
                activeMortgages.push({
                  monthlyPayment: Number(ev.monthlyLoanPayment || calculatedHousingResult.monthlyPayment),
                  remainingYears: Number(ev.loanYears || 35),
                });
              } else {
                eventCostThisYear += Number(ev.cost || 0);
              }
            }
          });

          currentWealth -= eventCostThisYear;

          result.push({
            year: calendarYear,
            age,
            rawWealth: Math.round(currentWealth),
            assets: Math.round(Math.max(0, currentWealth)),
            events: eventNames.join(' / '),
          });
        }
        return result;
      };

      const snapshotTotalSummaryByDate = useMemo(() => {
        if (accountSnapshots.length === 0) return [];
        const accMap = new Map(accounts.map((a) => [a.id, a]));
        const activeAccIds = accounts.filter((a) => !a.closedDate).map((a) => a.id);
        const byDate = {};

        accountSnapshots.forEach((s) => {
          if (!byDate[s.date]) {
            byDate[s.date] = { date: s.date, netTotal: 0, recordedAccIds: new Set() };
          }
          const acc = accMap.get(s.accountId);
          const isLiab = acc ? Boolean(acc.isLiability) : false;
          const val = Number(s.accountTotalAmount || 0);
          byDate[s.date].netTotal += isLiab ? -val : val;
          byDate[s.date].recordedAccIds.add(s.accountId);
        });

        return Object.values(byDate)
          .sort((a, b) => a.date.localeCompare(b.date))
          .map((d) => ({
            date: d.date,
            netTotal: d.netTotal,
            recordedCount: d.recordedAccIds.size,
            totalActiveCount: activeAccIds.length,
            isComplete: activeAccIds.length > 0 && activeAccIds.every((id) => d.recordedAccIds.has(id)),
          }));
      }, [accountSnapshots, accounts]);

      const simulationData = useMemo(() => {
        const currentCalendarYear = new Date().getFullYear();
        const sortedPast = [...pastHistory].sort((a, b) => a.ageOffset - b.ageOffset);

        const standardFuture = runScenarioProjection(profile.defaultReturnRate);
        const conservativeFuture = runScenarioProjection(0.01);
        const optimisticFuture = runScenarioProjection(0.055);

        const combined = [];

        sortedPast.forEach((h) => {
          const val = Math.round(Number(h.amount));
          combined.push({
            isPast: true,
            isSnapshotPoint: false,
            isCurrent: false,
            year: currentCalendarYear + h.ageOffset,
            age: profile.currentAge + h.ageOffset,
            label: h.label,
            assets: val,
            conservative: val,
            optimistic: val,
            rawWealth: val,
            events: '',
          });
        });

        snapshotTotalSummaryByDate.forEach((snapDay) => {
          const val = Math.round(snapDay.netTotal);
          combined.push({
            isPast: true,
            isSnapshotPoint: true,
            isCompleteSnapshot: snapDay.isComplete,
            isCurrent: false,
            year: Number(snapDay.date.slice(0, 4)) || currentCalendarYear,
            age: profile.currentAge,
            label: snapDay.date.slice(5),
            fullDate: snapDay.date,
            assets: Math.max(0, val),
            conservative: Math.max(0, val),
            optimistic: Math.max(0, val),
            rawWealth: val,
            events: snapDay.isComplete
              ? `完全記録(${snapDay.recordedCount}/${snapDay.totalActiveCount}口座)`
              : `一部記録(${snapDay.recordedCount}/${snapDay.totalActiveCount}口座)`,
          });
        });

        standardFuture.forEach((std, idx) => {
          combined.push({
            isPast: false,
            isSnapshotPoint: false,
            isCurrent: idx === 0,
            year: std.year,
            age: std.age,
            label: idx === 0 ? '現在' : `${std.age}歳`,
            assets: std.assets,
            conservative: conservativeFuture[idx].assets,
            optimistic: optimisticFuture[idx].assets,
            rawWealth: std.rawWealth,
            events: std.events,
          });
        });

        return combined.map((item, index) => ({ ...item, index }));
      }, [
        pastHistory,
        snapshotTotalSummaryByDate,
        summaryStats.totalAssets,
        annualNetSavings,
        profile,
        lifeEvents,
        budget.monthlyLivingCost,
        calculatedHousingResult,
      ]);

      const shortfallAlert = useMemo(() => {
        const futurePoints = simulationData.filter((d) => !d.isPast);
        const depleted = futurePoints.find((d) => d.rawWealth <= 0);
        if (depleted) {
          return {
            level: 'danger',
            message: `⚠️ ${depleted.age}歳 (${depleted.year}年) 頃に標準シナリオで資産が枯渇する見込みです。積立額やイベント予算の見直しを検討してください。`,
          };
        }
        const lowCash = futurePoints.find((d) => d.rawWealth < 2000000);
        if (lowCash) {
          return {
            level: 'warning',
            message: `⚡ ${lowCash.age}歳 (${lowCash.year}年) 頃に総資産が200万円を下回るタイミングがあります。`,
          };
        }
        return null;
      }, [simulationData]);

      const allAvailableTags = useMemo(() => {
        const tagSet = new Set();
        assets.forEach((a) => {
          (a.tags || []).forEach((t) => tagSet.add(t));
        });
        accountSnapshots.forEach((s) => {
          (s.items || []).forEach((it) => {
            if (Array.isArray(it.tags)) {
              it.tags.forEach((t) => tagSet.add(t));
            }
          });
        });
        return Array.from(tagSet);
      }, [assets, accountSnapshots]);

      const allTrackableItems = useMemo(() => {
        const itemMap = new Map();
        assets.forEach((a) => {
          itemMap.set(a.id, { id: a.id, name: a.name, accountId: a.accountId });
        });
        accountSnapshots.forEach((s) => {
          (s.items || []).forEach((it) => {
            if (it && it.assetId && !itemMap.has(it.assetId)) {
              itemMap.set(it.assetId, {
                id: it.assetId,
                name: `${it.name} (過去履歴)`,
                accountId: s.accountId,
              });
            }
          });
        });
        return Array.from(itemMap.values());
      }, [assets, accountSnapshots]);

      // 6軸推移分析データエンジン
      const advancedTrendData = useMemo(() => {
        if (accountSnapshots.length === 0) {
          return { dates: [], series: [], maxVal: 1000000, dateCompleteness: [] };
        }

        const allSortedDates = Array.from(new Set(accountSnapshots.map((s) => s.date))).sort((a, b) =>
          a.localeCompare(b)
        );
        const latestDateStr = allSortedDates[allSortedDates.length - 1];
        const latestTime = new Date(`${latestDateStr}T00:00:00+09:00`).getTime();

        const filteredDates = allSortedDates.filter((dStr) => {
          const t = new Date(`${dStr}T00:00:00+09:00`).getTime();
          if (trendRange === 'custom') {
            if (customStartDate && dStr < customStartDate) return false;
            if (customEndDate && dStr > customEndDate) return false;
            return true;
          }
          if (trendRange === 'all') return true;

          let daysCount = 365.25;
          if (trendRange === '1m') daysCount = 30;
          else if (trendRange === '3m') daysCount = 90;
          else if (trendRange === '6m') daysCount = 180;
          else if (trendRange === '1y') daysCount = 365.25;
          else if (trendRange === '3y') daysCount = 3 * 365.25;

          const cutoff = latestTime - daysCount * 24 * 60 * 60 * 1000;
          return t >= cutoff;
        });

        if (filteredDates.length === 0) {
          return { dates: [], series: [], maxVal: 1000000, dateCompleteness: [] };
        }

        const seriesList = [];
        const accMap = new Map(accounts.map((a) => [a.id, a]));
        const instMap = new Map(institutions.map((i) => [i.id, i]));
        const activeAccountsList = accounts.filter((a) => !a.closedDate);

        const dateCompleteness = filteredDates.map((dStr) => {
          const snapsOnDate = accountSnapshots.filter((s) => s.date === dStr);
          const recordedAccIds = new Set(snapsOnDate.map((s) => s.accountId));
          const missingCount = activeAccountsList.filter((a) => !recordedAccIds.has(a.id)).length;
          const isComplete = activeAccountsList.length > 0 && missingCount === 0;
          return {
            date: dStr,
            recordedCount: recordedAccIds.size,
            totalActiveCount: activeAccountsList.length,
            isComplete,
          };
        });

        if (trendDimension === 'networth') {
          const modes = selectedTrendLiabModes.length > 0 ? selectedTrendLiabModes : ['totalAssets', 'netWorth'];
          const labelsMap = {
            totalAssets: '総資産 (プラス資産合計)',
            netWorth: '純資産 (資産 − 負債)',
            totalLiabilities: '総負債 (ローン残債等)',
          };
          const colorsMap = { totalAssets: '#4f46e5', netWorth: '#10b981', totalLiabilities: '#f43f5e' };

          modes.forEach((mode, idx) => {
            const isPartialFlags = [];
            const points = filteredDates.map((dStr, dIdx) => {
              const snapsOnDate = accountSnapshots.filter((s) => s.date === dStr);
              if (snapsOnDate.length === 0) {
                isPartialFlags.push(false);
                return null;
              }

              isPartialFlags.push(!dateCompleteness[dIdx].isComplete);

              let assetSum = 0;
              let liabSum = 0;
              snapsOnDate.forEach((s) => {
                const acc = accMap.get(s.accountId);
                const val = Number(s.accountTotalAmount || 0);
                if (acc && acc.isLiability) {
                  liabSum += val;
                } else {
                  assetSum += val;
                }
              });

              if (mode === 'totalAssets') return assetSum;
              if (mode === 'netWorth') return assetSum - liabSum;
              if (mode === 'totalLiabilities') return liabSum;
              return null;
            });

            seriesList.push({
              id: mode,
              label: labelsMap[mode] || mode,
              color: colorsMap[mode] || SERIES_COLORS[idx % SERIES_COLORS.length],
              points,
              isPartialFlags,
            });
          });
        } else if (trendDimension === 'account') {
          selectedTrendAccountIds.forEach((accId, idx) => {
            const accObj = accMap.get(accId);
            if (!accObj) return;
            const instObj = instMap.get(accObj.institutionId);
            const label = instObj ? `${instObj.name} / ${accObj.name}` : accObj.name;

            const points = filteredDates.map((dStr) => {
              const snap = accountSnapshots.find((s) => s.accountId === accId && s.date === dStr);
              return snap ? Number(snap.accountTotalAmount) : null;
            });

            seriesList.push({
              id: accId,
              label,
              color: SERIES_COLORS[idx % SERIES_COLORS.length],
              points,
              isPartialFlags: filteredDates.map(() => false),
            });
          });
        } else if (trendDimension === 'institution') {
          selectedTrendInstIds.forEach((instId, idx) => {
            const instObj = instMap.get(instId);
            if (!instObj) return;
            const instAccounts = accounts.filter((a) => a.institutionId === instId && !a.closedDate);
            const allInstAccountIds = new Set(accounts.filter((a) => a.institutionId === instId).map((a) => a.id));

            const isPartialFlags = [];
            const points = filteredDates.map((dStr) => {
              const snapsOnDate = accountSnapshots.filter(
                (s) => allInstAccountIds.has(s.accountId) && s.date === dStr
              );
              if (snapsOnDate.length === 0) {
                isPartialFlags.push(false);
                return null;
              }
              const recordedIds = new Set(snapsOnDate.map((s) => s.accountId));
              const isPartial = instAccounts.some((a) => !recordedIds.has(a.id));
              isPartialFlags.push(isPartial);

              const sum = snapsOnDate.reduce((accSum, s) => {
                const acc = accMap.get(s.accountId);
                const val = Number(s.accountTotalAmount || 0);
                return accSum + (acc?.isLiability ? -val : val);
              }, 0);
              return sum;
            });

            seriesList.push({
              id: instId,
              label: instObj.name,
              color: SERIES_COLORS[idx % SERIES_COLORS.length],
              points,
              isPartialFlags,
            });
          });
        } else if (trendDimension === 'item') {
          selectedTrendItemIds.forEach((targetAssetId, idx) => {
            const trackable = allTrackableItems.find((a) => a.id === targetAssetId);
            const label = trackable ? trackable.name : `資産ID:${targetAssetId}`;

            const points = filteredDates.map((dStr) => {
              let foundAmount = null;
              accountSnapshots.forEach((s) => {
                if (s.date === dStr && Array.isArray(s.items)) {
                  const matched = s.items.find((it) => it && it.assetId === targetAssetId);
                  if (matched) {
                    foundAmount = Number(matched.amount);
                  }
                }
              });
              return foundAmount;
            });

            seriesList.push({
              id: targetAssetId,
              label,
              color: SERIES_COLORS[idx % SERIES_COLORS.length],
              points,
              isPartialFlags: filteredDates.map(() => false),
            });
          });
        } else if (trendDimension === 'tag') {
          selectedTrendTags.forEach((tagName, idx) => {
            const points = filteredDates.map((dStr) => {
              const snapsOnDate = accountSnapshots.filter((s) => s.date === dStr);
              if (snapsOnDate.length === 0) return null;

              let tagSum = 0;
              let hasAnyRecord = false;
              snapsOnDate.forEach((s) => {
                if (Array.isArray(s.items)) {
                  s.items.forEach((it) => {
                    if (it && Array.isArray(it.tags) && it.tags.includes(tagName) && !it.isLiability) {
                      tagSum += Number(it.amount || 0);
                      hasAnyRecord = true;
                    }
                  });
                }
              });

              return hasAnyRecord ? tagSum : null;
            });

            seriesList.push({
              id: `tag_${tagName}`,
              label: `#${tagName}`,
              color: SERIES_COLORS[idx % SERIES_COLORS.length],
              points,
              isPartialFlags: filteredDates.map(() => false),
            });
          });
        } else if (trendDimension === 'category') {
          selectedTrendCategories.forEach((catKey, idx) => {
            const catLabel = getCategoryLabel(catKey);

            const points = filteredDates.map((dStr) => {
              const snapsOnDate = accountSnapshots.filter((s) => s.date === dStr);
              if (snapsOnDate.length === 0) return null;

              let catSum = 0;
              let hasAnyRecord = false;
              snapsOnDate.forEach((s) => {
                if (Array.isArray(s.items)) {
                  s.items.forEach((it) => {
                    if (it && it.category === catKey && !it.isLiability) {
                      catSum += Number(it.amount || 0);
                      hasAnyRecord = true;
                    }
                  });
                }
              });
              return hasAnyRecord ? catSum : null;
            });

            seriesList.push({
              id: `cat_${catKey}`,
              label: catLabel,
              color: SERIES_COLORS[idx % SERIES_COLORS.length],
              points,
              isPartialFlags: filteredDates.map(() => false),
            });
          });
        }

        const numericValues = seriesList
          .flatMap((s) => s.points)
          .filter((v) => v !== null && !Number.isNaN(v));
        const maxVal = numericValues.length > 0 ? Math.max(...numericValues, 100000) : 1000000;

        return {
          dates: filteredDates,
          series: seriesList,
          maxVal: Math.ceil(maxVal / 100000) * 100000 || 1000000,
          dateCompleteness,
        };
      }, [
        accountSnapshots,
        accounts,
        institutions,
        allTrackableItems,
        trendDimension,
        trendRange,
        customStartDate,
        customEndDate,
        selectedTrendAccountIds,
        selectedTrendInstIds,
        selectedTrendItemIds,
        selectedTrendTags,
        selectedTrendCategories,
        selectedTrendLiabModes,
      ]);

      const formatCurrency = (val) => {
        const num = Number(val || 0);
        if (Math.abs(num) >= 100000000) {
          return (num / 100000000).toFixed(2) + '億円';
        }
        return Math.round(num / 10000).toLocaleString() + '万円';
      };

      const formatExactYen = (val) => {
        const num = Number(val || 0);
        return `${num.toLocaleString()}円`;
      };

      const maxAssetValue = useMemo(() => {
        const allVals = simulationData.flatMap((d) =>
          showMultiScenario ? [d.assets, d.conservative, d.optimistic] : [d.assets]
        );
        const max = Math.max(...allVals, 10000000);
        return Math.ceil(max / 10000000) * 10000000;
      }, [simulationData, showMultiScenario]);

      const svgW = 560;
      const svgH = 215;
      const padL = 50;
      const padR = 16;
      const padT = 20;
      const padB = 30;
      const chartW = svgW - padL - padR;
      const chartH = svgH - padT - padB;

      const points = simulationData.map((d, idx) => {
        const denom = Math.max(1, simulationData.length - 1);
        const x = padL + (idx / denom) * chartW;
        const y = padT + chartH - (d.assets / maxAssetValue) * chartH;
        const yCons = padT + chartH - (d.conservative / maxAssetValue) * chartH;
        const yOpt = padT + chartH - (d.optimistic / maxAssetValue) * chartH;
        return { x, y, yCons, yOpt, ...d };
      });

      const polylineStr = points.map((p) => `${p.x},${p.y}`).join(' ');
      const futurePointsOnly = points.filter((p) => !p.isPast);
      const consPolylineStr = futurePointsOnly.map((p) => `${p.x},${p.yCons}`).join(' ');
      const optPolylineStr = futurePointsOnly.map((p) => `${p.x},${p.yOpt}`).join(' ');

      const areaStr = `${padL},${padT + chartH} ${polylineStr} ${padL + chartW},${padT + chartH}`;
      const safeIdx = Math.min(Math.max(0, selectedPointIndex), points.length - 1);
      const activePoint = points[safeIdx] || points[0];
      const currentPoint = points.find((p) => p.isCurrent) || points[0];
      const point10Y = simulationData.find((d) => !d.isPast && d.age === profile.currentAge + 10);
      const point30Y = simulationData[simulationData.length - 1];

      const activeAccounts = useMemo(() => {
        return accounts.filter((acc) => !acc.closedDate);
      }, [accounts]);

      // 金融機関・口座マスター操作
      const handleCreateInstitution = (name, type = 'bank') => {
        const trimmed = name.trim();
        if (!trimmed) return null;
        const existing = institutions.find((i) => i.name === trimmed);
        if (existing) return existing;
        const created = {
          id: `inst_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
          name: trimmed,
          type,
        };
        setInstitutions((prev) => [...prev, created]);
        return created;
      };

      const handleRenameInstitution = (instId) => {
        const trimmed = editingInstName.trim();
        if (!trimmed) return;
        setInstitutions((prev) => prev.map((i) => (i.id === instId ? { ...i, name: trimmed } : i)));
        setAssets((prev) => prev.map((a) => (a.institutionId === instId ? { ...a, institution: trimmed } : a)));
        setEditingInstId(null);
        setEditingInstName('');
      };

      const handleCreateAccount = ({ institutionId, name, accountType, isLiability }) => {
        const trimmedName = name.trim() || accountType;
        const isLiab = Boolean(isLiability || accountType === 'ローン');
        const created = {
          id: `acc_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
          institutionId,
          name: trimmedName,
          accountType,
          category: isLiab ? 'liability' : accountType === 'iDeCo' ? 'pension' : accountType === 'NISA' || accountType === '特定口座' ? 'investment' : 'cash',
          isLiability: isLiab,
          openedDate: null,
          closedDate: null,
        };
        setAccounts((prev) => [...prev, created]);
        setSelectedTrendAccountIds((prev) => (prev.length < 4 ? [...prev, created.id] : prev));
        return created;
      };

      const handleRenameAccount = (accId) => {
        const trimmed = editingAccName.trim();
        if (!trimmed) return;
        setAccounts((prev) => prev.map((a) => (a.id === accId ? { ...a, name: trimmed } : a)));
        setEditingAccId(null);
        setEditingAccName('');
      };

      const handleToggleCloseAccount = (accId) => {
        const todayStr = getJstDateString();
        setAccounts((prev) =>
          prev.map((a) =>
            a.id === accId ? { ...a, closedDate: a.closedDate ? null : todayStr } : a
          )
        );
      };

      const openAssetModal = () => {
        const defaultAcc = activeAccounts[0] || accounts[0];
        setNewAsset({
          name: '',
          accountId: defaultAcc ? defaultAcc.id : '',
          category: defaultAcc && defaultAcc.category !== 'liability' ? defaultAcc.category : 'cash',
          tagsInput: '貯蓄用',
          principal: '',
          amount: '',
        });
        setIsCreatingInlineAccount(false);
        setInlineInstMode(institutions.length > 0 ? 'existing' : 'new');
        setInlineInstId(institutions[0]?.id || '');
        setInlineNewInstName('');
        setInlineNewAccName('');
        setInlineNewAccType('普通預金');
        setInlineNewAccIsLiability(false);
        setModalType('asset');
      };

      const handleAddAsset = (e) => {
        e.preventDefault();
        if (!newAsset.name || !newAsset.amount) return;

        let targetAccountId = newAsset.accountId;
        let targetInstId = '';
        let targetInstName = '';
        let targetAccType = '普通預金';
        let targetIsLiability = false;

        if (isCreatingInlineAccount) {
          let resolvedInstId = inlineInstId;
          let resolvedInstName = '';
          if (inlineInstMode === 'new') {
            const createdInst = handleCreateInstitution(inlineNewInstName);
            if (!createdInst) return;
            resolvedInstId = createdInst.id;
            resolvedInstName = createdInst.name;
          } else {
            const existingInstObj = institutions.find((i) => i.id === resolvedInstId);
            resolvedInstName = existingInstObj ? existingInstObj.name : '';
          }
          if (!resolvedInstId) return;

          const createdAcc = handleCreateAccount({
            institutionId: resolvedInstId,
            name: inlineNewAccName || `${resolvedInstName || '新規'} ${inlineNewAccType}`,
            accountType: inlineNewAccType,
            isLiability: inlineNewAccIsLiability,
          });
          targetAccountId = createdAcc.id;
          targetInstId = resolvedInstId;
          targetInstName = resolvedInstName || '未設定';
          targetAccType = createdAcc.accountType;
          targetIsLiability = createdAcc.isLiability;
        } else {
          const accObj = accounts.find((a) => a.id === targetAccountId);
          if (!accObj) return;
          const instObj = institutions.find((i) => i.id === accObj.institutionId);
          targetInstId = accObj.institutionId;
          targetInstName = instObj ? instObj.name : '未設定';
          targetAccType = accObj.accountType;
          targetIsLiability = Boolean(accObj.isLiability);
        }

        const parsedTags = newAsset.tagsInput
          .split(/[,、\s]+/)
          .map((t) => t.trim())
          .filter(Boolean);
        const amt = Number(newAsset.amount);
        const prin = newAsset.principal !== '' ? Number(newAsset.principal) : amt;

        const createdAssetId = `asset_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
        setAssets((prevAssets) => [
          ...prevAssets,
          {
            id: createdAssetId,
            institutionId: targetInstId,
            accountId: targetAccountId,
            name: newAsset.name,
            institution: targetInstName,
            accountType: targetAccType,
            category: targetIsLiability ? 'liability' : newAsset.category,
            tags: parsedTags.length > 0 ? parsedTags : ['一般'],
            principal: prin,
            amount: amt,
            quantity: null,
            isLiability: targetIsLiability,
          },
        ]);
        setSelectedTrendItemIds((prev) => (prev.length < 4 ? [...prev, createdAssetId] : prev));
        setModalType(null);
      };

      const openBatchSnapshotModal = (targetDate = getJstDateString()) => {
        const initialMap = {};
        activeAccounts.forEach((acc) => {
          const existingSnap = accountSnapshots.find(
            (s) => s.accountId === acc.id && s.date === targetDate
          );
          const accountAssets = assets.filter((a) => a.accountId === acc.id);
          const suggestedItems = existingSnap
            ? (existingSnap.items || []).map((it) => ({
                assetId: it.assetId || null,
                name: it.name || '',
                amount: it.amount !== null && it.amount !== undefined ? String(it.amount) : '',
                tags: Array.isArray(it.tags) ? [...it.tags] : [],
                category: it.category || (acc.isLiability ? 'liability' : acc.category || 'cash'),
                isLiability: it.isLiability !== undefined && it.isLiability !== null ? Boolean(it.isLiability) : Boolean(acc.isLiability),
              }))
            : accountAssets.map((a) => ({
                assetId: a.id,
                name: a.name,
                amount: String(a.amount ?? ''),
                tags: Array.isArray(a.tags) ? [...a.tags] : [],
                category: a.category || (acc.isLiability ? 'liability' : 'cash'),
                isLiability: Boolean(acc.isLiability),
              }));

          initialMap[acc.id] = {
            selected: Boolean(existingSnap),
            amountStr: existingSnap ? String(existingSnap.accountTotalAmount) : '',
            note: existingSnap ? existingSnap.note || '' : '',
            showItems: existingSnap ? (existingSnap.items || []).length > 0 : false,
            itemsMode: existingSnap?.itemsMode === 'partial' ? 'partial' : 'full',
            items: suggestedItems,
          };
        });

        setBatchDate(targetDate);
        setBatchEntries(initialMap);
        setBatchUpdateCurrentAssets(false);
        setBatchFeedback('');
        setModalType('snapshotBatch');
      };

      const handleBatchDateChange = (nextDate) => {
        setBatchDate(nextDate);
        setBatchEntries((prev) => {
          const updated = { ...prev };
          activeAccounts.forEach((acc) => {
            const existingSnap = accountSnapshots.find(
              (s) => s.accountId === acc.id && s.date === nextDate
            );
            const currentEntry = updated[acc.id] || {
              selected: false,
              amountStr: '',
              note: '',
              showItems: false,
              itemsMode: 'full',
              items: [],
            };
            if (existingSnap) {
              updated[acc.id] = {
                ...currentEntry,
                selected: true,
                amountStr: String(existingSnap.accountTotalAmount),
                note: existingSnap.note || '',
                showItems: (existingSnap.items || []).length > 0,
                itemsMode: existingSnap.itemsMode === 'partial' ? 'partial' : 'full',
                items: (existingSnap.items || []).map((it) => ({
                  assetId: it.assetId || null,
                  name: it.name || '',
                  amount: it.amount !== null && it.amount !== undefined ? String(it.amount) : '',
                  tags: Array.isArray(it.tags) ? [...it.tags] : [],
                  category: it.category || (acc.isLiability ? 'liability' : acc.category || 'cash'),
                  isLiability: it.isLiability !== undefined && it.isLiability !== null ? Boolean(it.isLiability) : Boolean(acc.isLiability),
                })),
              };
            }
          });
          return updated;
        });
      };

      const handleSaveBatchSnapshots = (e) => {
        e.preventDefault();
        if (!batchDate) return;

        const validRecordsToSave = [];

        activeAccounts.forEach((acc) => {
          const entry = batchEntries[acc.id];
          if (!entry || !entry.selected) return;

          const trimmedAmount = String(entry.amountStr ?? '').trim();
          if (trimmedAmount === '') return;

          const parsedAmount = Number(trimmedAmount);
          if (Number.isNaN(parsedAmount)) return;

          const validItems = (entry.items || [])
            .filter((it) => String(it.name || '').trim() !== '' && String(it.amount ?? '').trim() !== '' && !Number.isNaN(Number(it.amount)))
            .map((it) => {
              const matchedMaster = it.assetId ? assets.find((a) => a.id === it.assetId) : null;
              const resolvedAssetId = it.assetId || `asset_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;
              const resolvedTags = Array.isArray(it.tags) && it.tags.length > 0
                ? [...it.tags]
                : matchedMaster && Array.isArray(matchedMaster.tags)
                ? [...matchedMaster.tags]
                : [];
              const resolvedCategory = it.category || matchedMaster?.category || (acc.isLiability ? 'liability' : acc.category || 'cash');
              const resolvedIsLiability =
                it.isLiability !== undefined && it.isLiability !== null
                  ? Boolean(it.isLiability)
                  : Boolean(acc.isLiability);

              return {
                assetId: resolvedAssetId,
                name: String(it.name).trim(),
                amount: Number(it.amount),
                tags: resolvedTags,
                category: resolvedCategory,
                isLiability: resolvedIsLiability,
              };
            });

          validRecordsToSave.push({
            accountId: acc.id,
            date: batchDate,
            accountTotalAmount: parsedAmount,
            items: validItems,
            itemsMode: entry.itemsMode === 'partial' ? 'partial' : 'full',
            isRecorded: true,
            note: String(entry.note || '').trim(),
          });
        });

        if (validRecordsToSave.length === 0) {
          setBatchFeedback('⚠️ 記録対象にチェックが入り、かつ残高が入力されている口座がありません。');
          return;
        }

        setAccountSnapshots((prev) => {
          const next = [...prev];
          validRecordsToSave.forEach((rec) => {
            const existingIdx = next.findIndex(
              (item) => item.accountId === rec.accountId && item.date === rec.date
            );
            if (existingIdx >= 0) {
              next[existingIdx] = {
                ...next[existingIdx],
                accountTotalAmount: rec.accountTotalAmount,
                items: rec.items,
                itemsMode: rec.itemsMode,
                isRecorded: true,
                note: rec.note,
              };
            } else {
              next.push({
                id: `snapshot_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
                accountId: rec.accountId,
                date: rec.date,
                accountTotalAmount: rec.accountTotalAmount,
                items: rec.items,
                itemsMode: rec.itemsMode,
                isRecorded: true,
                note: rec.note,
              });
            }
          });
          return next;
        });

        if (batchUpdateCurrentAssets) {
          const warningMessages = [];
          setAssets((prevAssets) => {
            let updatedAssets = [...prevAssets];
            validRecordsToSave.forEach((rec) => {
              const accObj = accounts.find((a) => a.id === rec.accountId);
              const instObj = accObj ? institutions.find((i) => i.id === accObj.institutionId) : null;
              const isLiab = accObj ? Boolean(accObj.isLiability) : false;
              const uncategorizedName = `${accObj?.name || '口座'} 未分類残高・差額`;

              if (rec.items.length > 0) {
                rec.items.forEach((it) => {
                  const idx = updatedAssets.findIndex(
                    (a) => a.id === it.assetId && a.accountId === rec.accountId
                  );
                  if (idx >= 0) {
                    updatedAssets[idx] = {
                      ...updatedAssets[idx],
                      name: it.name,
                      amount: it.amount,
                    };
                  } else {
                    updatedAssets.push({
                      id: it.assetId,
                      institutionId: accObj?.institutionId || '',
                      accountId: rec.accountId,
                      name: it.name.trim(),
                      institution: instObj?.name || '未設定',
                      accountType: accObj?.accountType || '普通預金',
                      category: it.category || (isLiab ? 'liability' : accObj?.category || 'cash'),
                      tags: Array.isArray(it.tags) && it.tags.length > 0 ? [...it.tags] : ['残高記録反映'],
                      principal: it.amount,
                      amount: it.amount,
                      quantity: null,
                      isLiability: isLiab,
                    });
                  }
                });

                const accountAssetsWithoutAdj = updatedAssets.filter(
                  (a) => a.accountId === rec.accountId && a.name !== uncategorizedName
                );
                const currentAccountAssetsSum = accountAssetsWithoutAdj.reduce(
                  (s, a) => s + Number(a.amount || 0),
                  0
                );
                const diff = rec.accountTotalAmount - currentAccountAssetsSum;

                const existingAdjIdx = updatedAssets.findIndex(
                  (a) => a.accountId === rec.accountId && a.name === uncategorizedName
                );

                if (rec.itemsMode === 'partial') {
                  const currentTotalWithAdj = updatedAssets
                    .filter((a) => a.accountId === rec.accountId)
                    .reduce((s, a) => s + Number(a.amount || 0), 0);
                  const partialDiff = rec.accountTotalAmount - currentTotalWithAdj;
                  if (partialDiff !== 0) {
                    warningMessages.push(
                      `ℹ️「${accObj?.name || '対象口座'}」は一部資産のみ入力のため未入力資産を保持しました（口座全体残高と現在資産合計に ${Math.abs(partialDiff).toLocaleString()}円 の差があります）。`
                    );
                  }
                  if (diff === 0 && existingAdjIdx >= 0) {
                    updatedAssets[existingAdjIdx] = {
                      ...updatedAssets[existingAdjIdx],
                      amount: 0,
                      principal: 0,
                    };
                  }
                } else {
                  const inputAssetIds = new Set(rec.items.map((it) => it.assetId).filter(Boolean));
                  const omittedAssets = accountAssetsWithoutAdj.filter((a) => !inputAssetIds.has(a.id));

                  if (diff > 0) {
                    if (existingAdjIdx >= 0) {
                      updatedAssets[existingAdjIdx] = {
                        ...updatedAssets[existingAdjIdx],
                        amount: diff,
                      };
                    } else {
                      updatedAssets.push({
                        id: `asset_adj_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
                        institutionId: accObj?.institutionId || '',
                        accountId: rec.accountId,
                        name: uncategorizedName,
                        institution: instObj?.name || '未設定',
                        accountType: accObj?.accountType || '普通預金',
                        category: isLiab ? 'liability' : 'cash',
                        tags: ['未分類残高'],
                        principal: diff,
                        amount: diff,
                        quantity: null,
                        isLiability: isLiab,
                      });
                    }
                  } else if (diff < 0) {
                    if (existingAdjIdx >= 0) {
                      updatedAssets[existingAdjIdx] = {
                        ...updatedAssets[existingAdjIdx],
                        amount: 0,
                        principal: 0,
                      };
                    }
                    const omittedNote =
                      omittedAssets.length > 0
                        ? `（未入力のまま保持された既存資産: ${omittedAssets.map((o) => o.name).join('・')}）`
                        : '';
                    warningMessages.push(
                      `⚠️「${accObj?.name || '対象口座'}」の現在資産合計が口座残高を ${Math.abs(diff).toLocaleString()}円 上回っています${omittedNote}。既存資産の自動削除やマイナス残高作成は行わず保持しました。`
                    );
                  } else if (diff === 0 && existingAdjIdx >= 0) {
                    updatedAssets[existingAdjIdx] = {
                      ...updatedAssets[existingAdjIdx],
                      amount: 0,
                      principal: 0,
                    };
                  }
                }
              } else {
                const accountAssets = updatedAssets.filter((a) => a.accountId === rec.accountId);
                if (accountAssets.length === 1) {
                  const targetIdx = updatedAssets.findIndex((a) => a.id === accountAssets[0].id);
                  if (targetIdx >= 0) {
                    updatedAssets[targetIdx] = {
                      ...updatedAssets[targetIdx],
                      amount: rec.accountTotalAmount,
                    };
                  }
                } else if (accountAssets.length === 0) {
                  updatedAssets.push({
                    id: `asset_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
                    institutionId: accObj?.institutionId || '',
                    accountId: rec.accountId,
                    name: accObj?.name || '口座残高',
                    institution: instObj?.name || '未設定',
                    accountType: accObj?.accountType || '普通預金',
                    category: isLiab ? 'liability' : accObj?.category || 'cash',
                    tags: ['残高記録反映'],
                    principal: rec.accountTotalAmount,
                    amount: rec.accountTotalAmount,
                    quantity: null,
                    isLiability: isLiab,
                  });
                } else {
                  const nonAdjSum = accountAssets
                    .filter((a) => a.name !== uncategorizedName)
                    .reduce((s, a) => s + Number(a.amount || 0), 0);
                  const diff = rec.accountTotalAmount - nonAdjSum;
                  const existingAdjIdx = updatedAssets.findIndex(
                    (a) => a.accountId === rec.accountId && a.name === uncategorizedName
                  );

                  if (diff > 0) {
                    if (existingAdjIdx >= 0) {
                      updatedAssets[existingAdjIdx] = {
                        ...updatedAssets[existingAdjIdx],
                        amount: diff,
                      };
                    } else {
                      updatedAssets.push({
                        id: `asset_adj_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
                        institutionId: accObj?.institutionId || '',
                        accountId: rec.accountId,
                        name: uncategorizedName,
                        institution: instObj?.name || '未設定',
                        accountType: accObj?.accountType || '普通預金',
                        category: isLiab ? 'liability' : 'cash',
                        tags: ['未分類残高'],
                        principal: diff,
                        amount: diff,
                        quantity: null,
                        isLiability: isLiab,
                      });
                    }
                  } else if (diff < 0) {
                    if (existingAdjIdx >= 0) {
                      updatedAssets[existingAdjIdx] = {
                        ...updatedAssets[existingAdjIdx],
                        amount: 0,
                        principal: 0,
                      };
                    }
                    warningMessages.push(
                      `⚠️「${accObj?.name || '対象口座'}」の現在資産合計が口座残高を ${Math.abs(diff).toLocaleString()}円 上回っています。既存資産は削除せず保持しました。`
                    );
                  } else if (diff === 0 && existingAdjIdx >= 0) {
                    updatedAssets[existingAdjIdx] = {
                      ...updatedAssets[existingAdjIdx],
                      amount: 0,
                      principal: 0,
                    };
                  }
                }
              }
            });
            return updatedAssets;
          });

          if (warningMessages.length > 0) {
            setStatusMessage(warningMessages.join(' / '));
          }
        }

        setModalType(null);
      };

      const handleSaveEditedSnapshot = (e) => {
        e.preventDefault();
        if (!editingSnapshot || !editingSnapshot.date) return;
        const trimmedAmt = String(editingSnapshot.amountStr ?? '').trim();
        if (trimmedAmt === '' || Number.isNaN(Number(trimmedAmt))) return;

        const parsedAmt = Number(trimmedAmt);
        const accObj = accounts.find((a) => a.id === editingSnapshot.accountId);
        const cleanedItems = (editingSnapshot.items || [])
          .filter((it) => String(it.name || '').trim() !== '' && String(it.amount ?? '').trim() !== '' && !Number.isNaN(Number(it.amount)))
          .map((it) => {
            const matchedMaster = it.assetId ? assets.find((a) => a.id === it.assetId) : null;
            return {
              assetId: it.assetId || `asset_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
              name: String(it.name).trim(),
              amount: Number(it.amount),
              tags: Array.isArray(it.tags)
                ? [...it.tags]
                : matchedMaster && Array.isArray(matchedMaster.tags)
                ? [...matchedMaster.tags]
                : [],
              category: it.category || matchedMaster?.category || (accObj?.isLiability ? 'liability' : accObj?.category || 'cash'),
              isLiability:
                it.isLiability !== undefined && it.isLiability !== null
                  ? Boolean(it.isLiability)
                  : Boolean(accObj?.isLiability),
            };
          });

        setAccountSnapshots((prev) => {
          const duplicateIdx = prev.findIndex(
            (s) =>
              s.id !== editingSnapshot.id &&
              s.accountId === editingSnapshot.accountId &&
              s.date === editingSnapshot.date
          );
          const filtered = prev.filter((_, idx) => idx !== duplicateIdx);
          return filtered.map((s) =>
            s.id === editingSnapshot.id
              ? {
                  ...s,
                  date: editingSnapshot.date,
                  accountTotalAmount: parsedAmt,
                  items: cleanedItems,
                  itemsMode: editingSnapshot.itemsMode === 'partial' ? 'partial' : 'full',
                  isRecorded: true,
                  note: String(editingSnapshot.note || '').trim(),
                }
              : s
          );
        });

        setEditingSnapshot(null);
        setModalType(null);
      };

      const openTransferModal = (existing = null) => {
        if (existing) {
          setEditingTransferId(existing.id);
          setTransferForm({
            date: existing.date,
            transferType: existing.transferType,
            fromAccountId: existing.fromAccountId || activeAccounts[0]?.id || '',
            toAccountId: existing.toAccountId || activeAccounts[0]?.id || '',
            amount: String(existing.amount),
            note: existing.note || '',
          });
        } else {
          setEditingTransferId(null);
          setTransferForm({
            date: getJstDateString(),
            transferType: 'internal',
            fromAccountId: activeAccounts[0]?.id || '',
            toAccountId: activeAccounts[1]?.id || activeAccounts[0]?.id || '',
            amount: '',
            note: '',
          });
        }
        setModalType('transfer');
      };

      const handleSaveTransfer = (e) => {
        e.preventDefault();
        const amt = Number(transferForm.amount);
        if (!transferForm.date || Number.isNaN(amt) || amt <= 0) return;

        const record = {
          id: editingTransferId || `tr_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
          date: transferForm.date,
          transferType: transferForm.transferType,
          fromAccountId: transferForm.transferType === 'external_in' ? null : transferForm.fromAccountId,
          toAccountId: transferForm.transferType === 'external_out' ? null : transferForm.toAccountId,
          amount: amt,
          note: String(transferForm.note || '').trim(),
        };

        setTransfers((prev) =>
          editingTransferId ? prev.map((t) => (t.id === editingTransferId ? record : t)) : [record, ...prev]
        );
