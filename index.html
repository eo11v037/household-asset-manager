        setEditingTransferId(null);
        setModalType(null);
      };

      const handleAddHistory = (e) => {
        e.preventDefault();
        if (!newHistory.label || !newHistory.amount) return;
        const amt = Number(newHistory.amount);
        const prin = newHistory.principal !== '' ? Number(newHistory.principal) : null;
        const cashVal = newHistory.cash !== '' ? Number(newHistory.cash) : null;

        setPastHistory([
          ...pastHistory,
          {
            id: Date.now().toString(),
            label: newHistory.label,
            ageOffset: -Math.abs(Number(newHistory.yearsAgo) || 1),
            amount: amt,
            principal: prin,
            cash: cashVal,
          },
        ]);
        setNewHistory({ label: '2021年', yearsAgo: 5, amount: '', principal: '', cash: '' });
        setModalType(null);
      };

      const handleAddEvent = (e) => {
        e.preventDefault();
        if (!newEvent.name) return;
        setLifeEvents([
          ...lifeEvents,
          {
            id: Date.now().toString(),
            name: newEvent.name,
            type: newEvent.type,
            age: Number(newEvent.age),
            cost: Number(newEvent.cost || 0),
            downPayment: Number(newEvent.downPayment || calculatedHousingResult.initialCashOut),
            monthlyLoanPayment: Number(newEvent.monthlyLoanPayment || calculatedHousingResult.monthlyPayment),
            loanYears: housingSim.loanYears,
            enabled: true,
          },
        ]);
        setNewEvent({ name: '', type: 'housing', age: 36, cost: '', downPayment: '', monthlyLoanPayment: '' });
        setModalType(null);
      };

      const buildFullBackupJson = () => {
        return JSON.stringify(
          {
            schemaVersion: 5,
            exportedAtJst: getJstDateString(),
            institutions,
            accounts,
            assets,
            pastHistory,
            accountSnapshots,
            transfers,
            budget,
            profile,
            lifeEvents,
            housingSim,
            educationSim,
          },
          null,
          2
        );
      };

      const handleExportBackup = () => {
        const payload = buildFullBackupJson();
        setBackupText(payload);
        setPendingRestorePreview(null);
        setStatusMessage(
          `全データをJSON形式で出力しました（金融機関${institutions.length}件・口座${accounts.length}件・資産${assets.length}件・残高履歴${accountSnapshots.length}件・資金移動${transfers.length}件）。`
        );
      };

      const handleExportCsv = () => {
        const rows = [
          ['データ種別', '日付/時期', '金融機関', '口座名', '項目名/区分', '金額(円)', '取得元本(円)', 'メモ'],
        ];

        assets.forEach((a) => {
          const instName = institutions.find((i) => i.id === a.institutionId)?.name || a.institution || '';
          const accName = accounts.find((acc) => acc.id === a.accountId)?.name || a.accountType || '';
          rows.push([
            '現在保有資産',
            getJstDateString(),
            instName,
            accName,
            a.name,
            String(a.isLiability ? -Number(a.amount) : Number(a.amount)),
            String(a.principal ?? ''),
            (a.tags || []).join('/'),
          ]);
        });

        accountSnapshots.forEach((s) => {
          const acc = accounts.find((a) => a.id === s.accountId);
          const instName = acc ? institutions.find((i) => i.id === acc.institutionId)?.name || '' : '';
          rows.push([
            '口座残高履歴',
            s.date,
            instName,
            acc?.name || s.accountId,
            `口座全体残高(${s.itemsMode === 'partial' ? '一部入力' : '全資産入力'})`,
            String(s.accountTotalAmount),
            '',
            s.note || '',
          ]);
        });

        transfers.forEach((t) => {
          const fromName = t.fromAccountId ? accounts.find((a) => a.id === t.fromAccountId)?.name || '' : '外部';
          const toName = t.toAccountId ? accounts.find((a) => a.id === t.toAccountId)?.name || '' : '外部';
          rows.push([
            '資金移動ログ',
            t.date,
            '',
            `${fromName} → ${toName}`,
            t.transferType === 'internal' ? '口座間振替' : t.transferType === 'external_in' ? '外部入金' : '外部出金',
            String(t.amount),
            '',
            t.note || '',
          ]);
        });

        const csvString = rows
          .map((r) => r.map((cell) => `"${String(cell).replace(/"/g, '""')}"`).join(','))
          .join('\n');

        setBackupText(csvString);
        setPendingRestorePreview(null);
        setStatusMessage('CSV形式で出力しました。スプレッドシート等に貼り付けて利用できます。');
      };

      const handlePrepareRestore = () => {
        try {
          const parsed = JSON.parse(backupText);
          const check = validateBackupPayload(parsed);
          if (!check.valid) {
            setPendingRestorePreview(null);
            setStatusMessage(`⚠️ 復元中止（検証エラー）: ${check.error} 現在のデータは変更されていません。`);
            return;
          }
          const restored = normalizeStateObject(parsed);
          setPendingRestorePreview({
            restored,
            currentBackupJson: buildFullBackupJson(),
          });
          setStatusMessage(
            `検証OK: 復元対象のデータ件数を確認してください（金融機関${restored.migrationReport.after.institutions}件・口座${restored.migrationReport.after.accounts}件・資産${restored.migrationReport.after.assets}件・残高履歴${restored.migrationReport.after.accountSnapshots}件・資金移動${restored.migrationReport.after.transfers}件）。`
          );
        } catch (err) {
          setPendingRestorePreview(null);
          setStatusMessage('⚠️ JSONの解析に失敗しました。構文が正しいか確認してください（現在のデータは維持されています）。');
        }
      };

      const handleConfirmRestore = () => {
        if (!pendingRestorePreview) return;
        const { restored } = pendingRestorePreview;
        setInstitutions(restored.institutions);
        setAccounts(restored.accounts);
        setAssets(restored.assets);
        setPastHistory(restored.pastHistory);
        setAccountSnapshots(restored.accountSnapshots);
        setTransfers(restored.transfers);
        setBudget(restored.budget);
        setProfile(restored.profile);
        setLifeEvents(restored.lifeEvents);
        setHousingSim(restored.housingSim);
        setEducationSim(restored.educationSim);
        setLastMigrationReport(restored.migrationReport);
        setPendingRestorePreview(null);
        setStatusMessage(
          `✅ 復元完了！復元後の件数: 金融機関 ${restored.institutions.length}件 / 口座 ${restored.accounts.length}件 / 資産 ${restored.assets.length}件 / 残高履歴 ${restored.accountSnapshots.length}件 / 資金移動 ${restored.transfers.length}件`
        );
      };

      const donutRadius = 64;
      const donutCircumference = 2 * Math.PI * donutRadius;
      let cumulativePercent = 0;

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 font-sans pb-24 select-none">
          <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
            <div className="max-w-lg mx-auto px-4 h-14 flex items-center justify-between">
              <div className="flex items-center space-x-2">
                <span className="text-xl">📊</span>
                <div>
                  <h1 className="text-sm font-extrabold text-slate-900 leading-tight">我が家の総資産プラットフォーム</h1>
                  <p className="text-[10px] text-slate-400">過去分析・現在構成・将来予測・住宅・教育シミュ</p>
                </div>
              </div>
              <div className="text-right">
                <span className="text-[10px] text-slate-400 block leading-none">純資産 (資産−負債)</span>
                <span className="text-sm font-extrabold text-indigo-600">{formatCurrency(summaryStats.netWorth)}</span>
              </div>
            </div>

            <nav className="max-w-lg mx-auto grid grid-cols-6 border-t border-slate-100 bg-white">
              {[
                { id: 'dashboard', label: '総合推移', emoji: '📈' },
                { id: 'assets', label: '現在構成', emoji: '🍩' },
                { id: 'history', label: '過去分析', emoji: '🔍' },
                { id: 'simulators', label: '専用シミュ', emoji: '🏡' },
                { id: 'events', label: 'イベント', emoji: '📅' },
                { id: 'backup', label: 'データ', emoji: '💾' },
              ].map((t) => (
                <button
                  key={t.id}
                  onClick={() => setActiveTab(t.id)}
                  className={`flex flex-col items-center justify-center py-2 border-b-2 text-[10px] font-bold transition-colors ${
                    activeTab === t.id ? 'border-indigo-600 text-indigo-600 bg-indigo-50/40' : 'border-transparent text-slate-500'
                  }`}
                >
                  <span className="text-sm mb-0.5">{t.emoji}</span>
                  <span>{t.label}</span>
                </button>
              ))}
            </nav>
          </header>

          <main className="max-w-lg mx-auto px-3.5 mt-4 space-y-4">
            {storageWarning && (
              <div className="p-3 bg-rose-50 border border-rose-300 rounded-2xl text-xs font-bold text-rose-800 flex items-start justify-between gap-2">
                <span>⚠️ 保存警告: {storageWarning}</span>
                <button onClick={() => setStorageWarning('')} className="text-rose-700 font-extrabold shrink-0">
                  ✕
                </button>
              </div>
            )}

            {statusMessage && activeTab !== 'backup' && (
              <div className="p-3 bg-amber-50 border border-amber-300 rounded-2xl text-xs font-bold text-amber-900 flex items-start justify-between gap-2">
                <span>{statusMessage}</span>
                <button onClick={() => setStatusMessage('')} className="text-amber-700 font-extrabold shrink-0">
                  ✕
                </button>
              </div>
            )}

            {/* ==================== 1. 総合推移タブ ==================== */}
            {activeTab === 'dashboard' && (
              <>
                {assets.length === 0 && accountSnapshots.length === 0 && (
                  <div className="p-4 bg-indigo-50 border border-indigo-200 rounded-2xl space-y-2">
                    <p className="text-xs font-extrabold text-indigo-950">👋 はじめてご利用の方へ（初期空データ状態）</p>
                    <p className="text-[11px] text-indigo-800 leading-relaxed">
                      誤認防止のため、サンプル資産や仮の過去履歴は登録されていません。「🍩 現在構成」タブから金融機関・口座・保有資産を登録するか、「🔍 過去分析」タブから残高記録を開始してください。
                    </p>
                    <div className="flex gap-2 pt-1">
                      <button
                        onClick={() => setActiveTab('assets')}
                        className="bg-indigo-600 text-white px-3 py-1.5 rounded-xl text-xs font-bold"
                      >
                        ＋ 資産・口座を登録する
                      </button>
                      <button
                        onClick={() => setActiveTab('backup')}
                        className="bg-white text-indigo-700 border border-indigo-300 px-3 py-1.5 rounded-xl text-xs font-bold"
                      >
                        JSONから復元
                      </button>
                    </div>
                  </div>
                )}

                {shortfallAlert && (
                  <div
                    className={`p-3 rounded-2xl border text-xs font-bold leading-relaxed ${
                      shortfallAlert.level === 'danger'
                        ? 'bg-rose-50 border-rose-300 text-rose-800'
                        : 'bg-amber-50 border-amber-300 text-amber-800'
                    }`}
                  >
                    {shortfallAlert.message}
                  </div>
                )}

                <div className="grid grid-cols-2 gap-2.5">
                  <div className="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-2xs">
                    <p className="text-[11px] font-medium text-slate-500">現在の総資産</p>
                    <p className="text-lg font-extrabold text-slate-900 mt-0.5">{formatCurrency(summaryStats.totalAssets)}</p>
                    <p className="text-[10px] text-emerald-600 font-bold mt-1">
                      含み益 {summaryStats.unrealizedGain >= 0 ? '+' : ''}
                      {formatCurrency(summaryStats.unrealizedGain)}
                    </p>
                  </div>

                  <div className="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-2xs">
                    <p className="text-[11px] font-medium text-slate-500">純資産 (負債 {formatCurrency(summaryStats.totalLiabilities)})</p>
                    <p className="text-lg font-extrabold text-indigo-600 mt-0.5">{formatCurrency(summaryStats.netWorth)}</p>
                    {lastPastRecord && (
                      <p className="text-[10px] text-slate-500 mt-1">
                        {lastPastRecord.label}比 +{formatCurrency(summaryStats.totalAssets - lastPastRecord.amount)}
                      </p>
                    )}
                  </div>

                  <div className="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-2xs">
                    <p className="text-[11px] font-medium text-slate-500">10年後 ({profile.currentAge + 10}歳)</p>
                    <p className="text-lg font-extrabold text-sky-600 mt-0.5">{formatCurrency(point10Y?.assets)}</p>
                    <p className="text-[10px] text-slate-400 mt-1">
                      保守 {formatCurrency(point10Y?.conservative)}〜楽観 {formatCurrency(point10Y?.optimistic)}
                    </p>
                  </div>

                  <div className="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-2xs">
                    <p className="text-[11px] font-medium text-slate-500">30年後 ({profile.currentAge + 30}歳)</p>
                    <p className="text-lg font-extrabold text-purple-600 mt-0.5">{formatCurrency(point30Y?.assets)}</p>
                    <p className="text-[10px] text-slate-400 mt-1">
                      保守 {formatCurrency(point30Y?.conservative)}〜楽観 {formatCurrency(point30Y?.optimistic)}
                    </p>
                  </div>
                </div>

                <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-2xs">
                  <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                    <div>
                      <h2 className="text-sm font-bold text-slate-900">過去実績 〜 未来30年推移</h2>
                      <p className="text-[10px] text-slate-500">緑＝過去 / 橙＝口座実測連動 / 青＝標準予測</p>
                    </div>
                    <div className="flex items-center space-x-1.5">
                      <button
                        onClick={() => setShowMultiScenario(!showMultiScenario)}
                        className={`px-2 py-1.5 rounded-lg text-[10px] font-bold border ${
                          showMultiScenario
                            ? 'bg-indigo-50 border-indigo-200 text-indigo-700'
                            : 'bg-slate-50 border-slate-200 text-slate-500'
                        }`}
                      >
                        3シナリオ {showMultiScenario ? 'ON' : 'OFF'}
                      </button>
                      <select
                        value={profile.defaultReturnRate}
                        onChange={(e) => setProfile({ ...profile, defaultReturnRate: parseFloat(e.target.value) })}
                        className="bg-slate-50 text-xs font-bold text-indigo-600 border border-slate-300 rounded-lg px-2 py-1.5"
                      >
                        <option value={0.01}>標準 1.0%</option>
                        <option value={0.03}>標準 3.0%</option>
                        <option value={0.035}>標準 3.5%</option>
                        <option value={0.05}>標準 5.0%</option>
                      </select>
                    </div>
                  </div>

                  {activePoint && (
                    <div
                      className={`mt-3 p-3 rounded-xl border ${
                        activePoint.isSnapshotPoint
                          ? 'bg-amber-50 border-amber-200'
                          : activePoint.isPast
                          ? 'bg-emerald-50 border-emerald-200'
                          : activePoint.isCurrent
                          ? 'bg-sky-50 border-sky-200'
                          : 'bg-indigo-50 border-indigo-100'
                      }`}
                    >
                      <div className="flex items-center justify-between">
                        <div>
                          <span
                            className={`text-xs font-bold ${
                              activePoint.isSnapshotPoint
                                ? 'text-amber-900'
                                : activePoint.isPast
                                ? 'text-emerald-800'
                                : 'text-indigo-800'
                            }`}
                          >
                            {activePoint.isSnapshotPoint
                              ? `【口座残高実測連動】${activePoint.fullDate}`
                              : activePoint.isPast
                              ? `【過去実績】${activePoint.label} (${activePoint.age}歳)`
                              : activePoint.isCurrent
                              ? `【現在】${activePoint.year}年 (${activePoint.age}歳)`
                              : `${activePoint.age}歳 (${activePoint.year}年)`}
                          </span>
                          {activePoint.events && (
                            <span
                              className={`block text-[11px] font-bold mt-0.5 ${
                                activePoint.isSnapshotPoint
                                  ? activePoint.isCompleteSnapshot
                                    ? 'text-emerald-700'
                                    : 'text-amber-700'
                                  : 'text-rose-600'
                              }`}
                            >
                              📌 {activePoint.events}
                            </span>
                          )}
                        </div>
                        <div className="text-right">
                          <span className="text-[10px] text-slate-500 block">{activePoint.isPast ? '実績額' : '標準予測'}</span>
                          <span
                            className={`text-base font-extrabold ${
                              activePoint.isSnapshotPoint
                                ? 'text-amber-800'
                                : activePoint.isPast
                                ? 'text-emerald-700'
                                : 'text-indigo-700'
                            }`}
                          >
                            {formatCurrency(activePoint.assets)}
                          </span>
                        </div>
                      </div>
                      {!activePoint.isPast && !activePoint.isCurrent && showMultiScenario && (
                        <div className="mt-2 pt-2 border-t border-indigo-200/60 flex justify-between text-[10px] font-bold">
                          <span className="text-slate-600">🐢 保守(1.0%): {formatCurrency(activePoint.conservative)}</span>
                          <span className="text-emerald-700">🚀 楽観(5.5%): {formatCurrency(activePoint.optimistic)}</span>
                        </div>
                      )}
                    </div>
                  )}

                  <div className="w-full mt-2">
                    <svg viewBox={`0 0 ${svgW} ${svgH}`} className="w-full h-auto">
                      <defs>
                        <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
                          <stop offset="0%" stopColor="#4f46e5" stopOpacity="0.22" />
                          <stop offset="100%" stopColor="#4f46e5" stopOpacity="0.0" />
                        </linearGradient>
                      </defs>

                      {currentPoint && <rect x={padL} y={padT} width={Math.max(0, currentPoint.x - padL)} height={chartH} fill="#ecfdf5" opacity="0.8" />}

                      {[0, 0.25, 0.5, 0.75, 1].map((r, i) => {
                        const y = padT + chartH - r * chartH;
                        const val = maxAssetValue * r;
                        return (
                          <g key={i}>
                            <line x1={padL} y1={y} x2={padL + chartW} y2={y} stroke="#e2e8f0" strokeDasharray="3 3" />
                            <text x={padL - 6} y={y + 4} textAnchor="end" fontSize="10" fill="#64748b">
                              {val >= 100000000 ? `${(val / 100000000).toFixed(1)}億` : `${Math.round(val / 10000)}万`}
                            </text>
                          </g>
                        );
                      })}

                      {currentPoint && <line x1={currentPoint.x} y1={padT} x2={currentPoint.x} y2={padT + chartH} stroke="#0284c7" strokeWidth="1.5" strokeDasharray="3 2" />}

                      {points
                        .filter((p) => p.isPast || p.isCurrent || (p.age - profile.currentAge) % 5 === 0)
                        .map((p) => (
                          <text
                            key={p.index}
                            x={p.x}
                            y={svgH - 8}
                            textAnchor="middle"
                            fontSize="9"
                            fill={p.isSnapshotPoint ? '#d97706' : p.isPast ? '#059669' : '#64748b'}
                          >
                            {p.isPast ? p.label : p.isCurrent ? '現在' : `${p.age}歳`}
                          </text>
                        ))}

                      <polygon points={areaStr} fill="url(#areaGrad)" />

                              {checked ? '✓ ' : '+ '}
                              {m.label}
                            </button>
                          );
                        })}
                      </div>
                      <p className="text-[10px] text-slate-600 bg-slate-50 p-2 rounded-xl border border-slate-200">
                        ℹ️ 全有効口座（{activeAccounts.length}口座）の記録が揃っている日は「完全記録」、一部口座のみ記録された日は「⚠️ 一部記録」として区別表示します（未記録口座を0円として補完しません）。
                      </p>
                    </div>
                  )}

                  {advancedTrendData.dates.length === 0 || advancedTrendData.series.length === 0 ? (
                    <div className="p-5 bg-slate-50 rounded-xl border border-slate-200 text-center space-y-1.5">
                      <p className="text-xs font-bold text-slate-600">表示対象の残高スナップショット記録がありません</p>
                      <p className="text-[10px] text-slate-400">
                        「📸 一括残高記録」から口座残高（個別資産やタグの推移を見る場合は明細も入力）を記録すると時系列推移が表示されます。
                      </p>
                    </div>
                  ) : (
                    (() => {
                      const tDates = advancedTrendData.dates;
                      const tSeries = advancedTrendData.series;
                      const tMax = advancedTrendData.maxVal;
                      const safeDateIdx = Math.min(Math.max(0, selectedTrendDateIdx), tDates.length - 1);
                      const activeDateStr = tDates[safeDateIdx];
                      const activeCompleteness = advancedTrendData.dateCompleteness[safeDateIdx];

                      const gW = 540;
                      const gH = 195;
                      const gPadL = 52;
                      const gPadR = 16;
                      const gPadT = 16;
                      const gPadB = 28;
                      const innerW = gW - gPadL - gPadR;
                      const innerH = gH - gPadT - gPadB;

                      const getX = (idx) =>
                        tDates.length === 1 ? gPadL + innerW / 2 : gPadL + (idx / (tDates.length - 1)) * innerW;
                      const getY = (val) => gPadT + innerH - (Math.max(0, val) / tMax) * innerH;

                      return (
                        <div className="space-y-2.5">
                          <div className="p-3 bg-indigo-50/70 rounded-xl border border-indigo-200 space-y-1.5">
                            <div className="flex items-center justify-between gap-2 flex-wrap">
                              <div className="flex items-center space-x-1.5">
                                <span className="text-xs font-extrabold text-indigo-950">📅 記録日: {activeDateStr}</span>
                                {activeCompleteness && (
                                  <span
                                    className={`text-[9px] px-1.5 py-0.5 rounded font-bold ${
                                      activeCompleteness.isComplete
                                        ? 'bg-emerald-100 text-emerald-800'
                                        : 'bg-amber-100 text-amber-800'
                                    }`}
                                  >
                                    {activeCompleteness.isComplete
                                      ? `完全記録 (${activeCompleteness.recordedCount}/${activeCompleteness.totalActiveCount}口座)`
                                      : `⚠️ 一部記録 (${activeCompleteness.recordedCount}/${activeCompleteness.totalActiveCount}口座)`}
                                  </span>
                                )}
                              </div>
                              <span className="text-[10px] text-indigo-700 font-bold">
                                {safeDateIdx + 1} / {tDates.length} 記録点
                              </span>
                            </div>
                            <div className="space-y-1">
                              {tSeries.map((s) => {
                                const val = s.points[safeDateIdx];
                                const isPartial = s.isPartialFlags[safeDateIdx];
                                const firstValidVal = s.points.find((v) => v !== null);
                                const diffFromStart = val !== null && firstValidVal !== undefined ? val - firstValidVal : null;
                                const diffRate =
                                  diffFromStart !== null && firstValidVal > 0 ? (diffFromStart / firstValidVal) * 100 : null;

                                return (
                                  <div key={s.id} className="bg-white px-2.5 py-1.5 rounded-lg border border-indigo-100 space-y-0.5">
                                    <div className="flex items-center justify-between text-xs">
                                      <div className="flex items-center space-x-1.5">
                                        <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ backgroundColor: s.color }} />
                                        <span className="font-bold text-slate-800">{s.label}</span>
                                        {isPartial && (
                                          <span className="text-[9px] bg-amber-100 text-amber-800 px-1 rounded font-bold">
                                            ⚠️ 一部記録
                                          </span>
                                        )}
                                      </div>
                                      {val === null ? (
                                        <span className="text-[11px] font-bold text-slate-400">未記録 (データなし)</span>
                                      ) : (
                                        <span className="font-extrabold text-slate-900">
                                          {formatExactYen(val)}
                                          {val === 0 ? ' (0円記録)' : ''}
                                        </span>
                                      )}
                                    </div>
                                    {val !== null && diffFromStart !== null && (
                                      <div className="flex justify-end text-[10px] text-slate-500">
                                        <span>
                                          期間開始比:{' '}
                                          <strong className={diffFromStart >= 0 ? 'text-emerald-600' : 'text-rose-600'}>
                                            {diffFromStart >= 0 ? '+' : ''}
                                            {formatExactYen(diffFromStart)}
                                            {diffRate !== null ? ` (${diffRate >= 0 ? '+' : ''}${diffRate.toFixed(1)}%)` : ''}
                                          </strong>
                                        </span>
                                      </div>
                                    )}
                                  </div>
                                );
                              })}
                            </div>
                          </div>

                          <svg viewBox={`0 0 ${gW} ${gH}`} className="w-full h-auto">
                            {[0, 0.5, 1].map((r, i) => {
                              const y = gPadT + innerH - r * innerH;
                              const val = tMax * r;
                              return (
                                <g key={i}>
                                  <line x1={gPadL} y1={y} x2={gPadL + innerW} y2={y} stroke="#e2e8f0" strokeDasharray="3 3" />
                                  <text x={gPadL - 6} y={y + 4} textAnchor="end" fontSize="10" fill="#64748b">
                                    {formatCurrency(val)}
                                  </text>
                                </g>
                              );
                            })}

                            <line
                              x1={getX(safeDateIdx)}
                              y1={gPadT}
                              x2={getX(safeDateIdx)}
                              y2={gPadT + innerH}
                              stroke="#6366f1"
                              strokeWidth="1.5"
                              strokeDasharray="2 2"
                            />

                            {tSeries.map((s) => {
                              const solidSegments = [];
                              const gapSegments = [];
                              let currentSeg = [];
                              let lastKnownPoint = null;

                              s.points.forEach((val, idx) => {
                                if (val !== null) {
                                  const pt = { x: getX(idx), y: getY(val), idx };
                                  if (currentSeg.length === 0 && lastKnownPoint !== null) {
                                    gapSegments.push([lastKnownPoint, pt]);
                                  }
                                  currentSeg.push(pt);
                                  lastKnownPoint = pt;
                                } else {
                                  if (currentSeg.length > 0) {
                                    solidSegments.push(currentSeg);
                                    currentSeg = [];
                                  }
                                }
                              });
                              if (currentSeg.length > 0) solidSegments.push(currentSeg);

                              return (
                                <g key={s.id}>
                                  {gapSegments.map((gSeg, gIdx) => (
                                    <line
                                      key={`gap_${gIdx}`}
                                      x1={gSeg[0].x}
                                      y1={gSeg[0].y}
                                      x2={gSeg[1].x}
                                      y2={gSeg[1].y}
                                      stroke={s.color}
                                      strokeWidth="1.5"
                                      strokeDasharray="2 4"
                                      opacity="0.45"
                                    />
                                  ))}
                                  {solidSegments.map((seg, segIdx) =>
                                    seg.length > 1 ? (
                                      <polyline
                                        key={`seg_${segIdx}`}
                                        fill="none"
                                        stroke={s.color}
                                        strokeWidth="2.5"
                                        strokeLinecap="round"
                                        strokeLinejoin="round"
                                        points={seg.map((p) => `${p.x},${p.y}`).join(' ')}
                                      />
                                    ) : null
                                  )}
                                  {s.points.map((val, idx) => {
                                    if (val === null) return null;
                                    const cx = getX(idx);
                                    const cy = getY(val);
                                    const isSelected = idx === safeDateIdx;
                                    const isPartialPt = s.isPartialFlags[idx];
                                    return (
                                      <circle
                                        key={`pt_${idx}`}
                                        cx={cx}
                                        cy={cy}
                                        r={isSelected ? '6' : '4.5'}
                                        fill={isPartialPt ? '#fff' : s.color}
                                        stroke={s.color}
                                        strokeWidth={isPartialPt ? '2.5' : '1.5'}
                                        onClick={() => setSelectedTrendDateIdx(idx)}
                                      />
                                    );
                                  })}
                                </g>
                              );
                            })}

                            {tDates.map((dStr, idx) => (
                              <g key={`hit_${dStr}`} onClick={() => setSelectedTrendDateIdx(idx)}>
                                <rect
                                  x={getX(idx) - 14}
                                  y={gPadT}
                                  width="28"
                                  height={innerH}
                                  fill="transparent"
                                />
                                {(idx === 0 || idx === tDates.length - 1 || idx === safeDateIdx) && (
                                  <text x={getX(idx)} y={gH - 8} textAnchor="middle" fontSize="9" fill="#64748b">
                                    {dStr.slice(5)}
                                  </text>
                                )}
                              </g>
                            ))}
                          </svg>
                        </div>
                      );
                    })()

                  </div>

                  <div className="p-3 bg-slate-50 border-b border-slate-100 flex items-center justify-between gap-2">

                    {(() => {

                              <div>
                                <div className="flex items-center space-x-1.5 flex-wrap">
                                  <span className="text-[11px] font-extrabold text-indigo-700 bg-indigo-50 px-2 py-0.5 rounded">
                                    📅 {snap.date}

                                  {inst && (

                                  {(snap.items || []).length > 0 && (
                                    <span

                                  )}
                                </div>
                                {snap.note && (
                                  <p className="text-[11px] text-slate-600 mt-1">📝 {snap.note}</p>
                                )}
                              </div>
                              <div className="text-right shrink-0">
                                <span className="text-sm font-extrabold text-slate-900 block">
                                  {formatExactYen(snap.accountTotalAmount)}
                                </span>
                                {Number(snap.accountTotalAmount) === 0 && (
                                  <span className="text-[10px] font-bold text-sky-700 bg-sky-50 px-1.5 py-0.5 rounded inline-block">
                                    0円として記録済
                                  </span>
                                )}
                                <div className="flex items-center justify-end space-x-2 mt-1">
                                  <button
                                    onClick={() => {
                                      setEditingSnapshot({
                                        ...snap,
                                        itemsMode: snap.itemsMode === 'partial' ? 'partial' : 'full',
                                        amountStr: String(snap.accountTotalAmount),
                                        items: (snap.items || []).map((it) => ({
                                          assetId: it.assetId || null,
                                          name: it.name || '',
                                          amount: String(it.amount ?? ''),
                                          tags: Array.isArray(it.tags) ? [...it.tags] : [],

                                          isLiability: it.isLiability !== undefined ? it.isLiability : null,

                                    className="text-rose-500 text-[11px] font-bold"
                                  >
                                    削除
                                  </button>
                                </div>
                              </div>
                            </div>

                            {(snap.items || []).length > 0 && (
                              <div className="bg-slate-50 rounded-xl p-2 border border-slate-200/80 space-y-1">
                                <div className="flex items-center justify-between text-[10px] font-bold text-slate-500">

                                          </span>
                                        ))}
                                      </div>
                                    )}
                                  </div>
                                ))}
                              </div>
                            )}
                          </div>
                        );
                      });
                    })()}

            </div>
          )}

          {/* 資産・負債追加モーダル */}
          {modalType === 'asset' && (
            <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-2xl max-w-sm w-full p-5 shadow-xl max-h-[90vh] overflow-y-auto">
                <h3 className="text-base font-bold text-slate-900 mb-3">資産・負債の追加</h3>
                <form onSubmit={handleAddAsset} className="space-y-3">
                  <div>
                    <div className="flex items-center justify-between mb-1">
                      <label className="text-[11px] font-bold text-slate-600">所属口座を選択</label>
                      <button
                        type="button"
                        onClick={() => setIsCreatingInlineAccount(!isCreatingInlineAccount)}
                        className="text-[11px] font-bold text-indigo-600"
                      >
                        {isCreatingInlineAccount || activeAccounts.length === 0
                          ? '既存口座から選ぶ'
                          : '＋ 新しい金融機関・口座を作成'}
                      </button>
                    </div>

                    {!isCreatingInlineAccount && activeAccounts.length > 0 ? (
                      <select
                        value={newAsset.accountId}
                        onChange={(e) => setNewAsset({ ...newAsset, accountId: e.target.value })}
                        className="w-full bg-slate-50 border border-slate-300 rounded-xl px-2.5 py-2 text-xs font-bold"
                        required
                      >
                        {activeAccounts.map((acc) => {
                          const inst = institutions.find((i) => i.id === acc.institutionId);
                          return (
                            <option key={acc.id} value={acc.id}>
                              {inst ? `${inst.name} - ` : ''}{acc.name} ({acc.accountType})
                            </option>
                          );
                        })}
                      </select>
                    ) : (
                      <div className="p-3 bg-indigo-50/70 rounded-xl border border-indigo-200 space-y-2">
                        <div className="flex space-x-1 bg-white p-1 rounded-lg border border-slate-200">
                          <button
                            type="button"
                            onClick={() => setInlineInstMode('existing')}
                            disabled={institutions.length === 0}
                            className={`flex-1 py-1 rounded text-[11px] font-bold ${
                              inlineInstMode === 'existing' && institutions.length > 0
                                ? 'bg-indigo-600 text-white'
                                : 'text-slate-400'
                            }`}
                          >
                            既存の金融機関
                          </button>
                          <button
                            type="button"
                            onClick={() => setInlineInstMode('new')}
                            className={`flex-1 py-1 rounded text-[11px] font-bold ${
                              inlineInstMode === 'new' || institutions.length === 0
                                ? 'bg-indigo-600 text-white'
                                : 'text-slate-600'
                            }`}
                          >
                            新しい金融機関
                          </button>
                        </div>

                        {inlineInstMode === 'existing' && institutions.length > 0 ? (
                          <select
                            value={inlineInstId}
                            onChange={(e) => setInlineInstId(e.target.value)}
                            className="w-full bg-white border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs font-bold"
                          >
                            {institutions.map((i) => (
                              <option key={i.id} value={i.id}>
                                {i.name}
                              </option>
                            ))}
                          </select>
                        ) : (
                          <input
                            type="text"
                            placeholder="金融機関名 (例: 住信SBIネット銀行)"
                            value={inlineNewInstName}
                            onChange={(e) => setInlineNewInstName(e.target.value)}
                            className="w-full bg-white border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs"
                            required
                          />
                        )}

                        <div className="grid grid-cols-2 gap-1.5">
                          <select
                            value={inlineNewAccType}
                            onChange={(e) => setInlineNewAccType(e.target.value)}
                            className="bg-white border border-slate-300 rounded-lg px-2 py-1.5 text-xs font-bold"
                          >
                            <option value="普通預金">普通預金</option>
                            <option value="NISA">NISA</option>
                            <option value="特定口座">特定口座</option>
                            <option value="iDeCo">iDeCo</option>
                            <option value="ローン">ローン</option>
                          </select>
                          <input
                            type="text"
                            placeholder="口座名 (任意)"
                            value={inlineNewAccName}
                            onChange={(e) => setInlineNewAccName(e.target.value)}
                            className="bg-white border border-slate-300 rounded-lg px-2 py-1.5 text-xs"
                          />
                        </div>
                        <label className="flex items-center space-x-1.5 text-[11px] font-bold text-rose-700">
                          <input
                            type="checkbox"
                            checked={inlineNewAccIsLiability}
                            onChange={(e) => setInlineNewAccIsLiability(e.target.checked)}
                            className="accent-rose-600"
                          />
                          <span>この口座を負債・ローン口座として登録</span>
                        </label>
                      </div>
                    )}
                  </div>

                  {(() => {
                    const useNewAccForm = isCreatingInlineAccount || activeAccounts.length === 0;
                    const selectedAcc = !useNewAccForm
                      ? accounts.find((a) => a.id === newAsset.accountId)
                      : null;
                    const resolvedIsLiab = useNewAccForm
                      ? Boolean(inlineNewAccIsLiability || inlineNewAccType === 'ローン')
                      : Boolean(selectedAcc?.isLiability);

                    return (
                      <>
                        <div className="px-2.5 py-1.5 rounded-lg bg-slate-100 text-[11px] font-bold flex items-center justify-between">
                          <span className="text-slate-600">口座種別判定:</span>
                          <span className={resolvedIsLiab ? 'text-rose-600' : 'text-indigo-600'}>
                            {resolvedIsLiab ? '負債・ローンとして計上' : 'プラス資産として計上'}
                          </span>
                        </div>

                        <div>
                          <label className="block text-[11px] font-bold text-slate-600 mb-1">資産・銘柄名</label>
                          <input
                            type="text"
                            placeholder="例: オルカン / 普通預金残高"
                            value={newAsset.name}
                            onChange={(e) => setNewAsset({ ...newAsset, name: e.target.value })}
                            className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm"
                            required
                          />
                        </div>

                        {!resolvedIsLiab && (
                          <div>
                            <label className="block text-[11px] font-bold text-slate-600 mb-1">資産カテゴリ</label>
                            <select
                              value={newAsset.category}
                              onChange={(e) => setNewAsset({ ...newAsset, category: e.target.value })}
                              className="w-full bg-slate-50 border border-slate-300 rounded-xl px-2.5 py-2 text-xs font-bold"
                            >
                              <option value="cash">現金・預金</option>
                              <option value="investment">投資信託・株式</option>
                              <option value="pension">年金・iDeCo</option>
                            </select>
                          </div>
                        )}

                        <div>
                          <label className="block text-[11px] font-bold text-slate-600 mb-1">タグ（スペース・カンマ区切り）</label>
                          <input
                            type="text"
                            placeholder="例: 投資信託 海外分散 教育資金"
                            value={newAsset.tagsInput}
                            onChange={(e) => setNewAsset({ ...newAsset, tagsInput: e.target.value })}
                            className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm"
                          />
                        </div>

                        <div className="grid grid-cols-2 gap-2">
                          {!resolvedIsLiab && (
                            <div>
                              <label className="block text-[11px] font-bold text-slate-600 mb-1">取得元本 (円)</label>
                              <input
                                type="number"
                                placeholder="任意"
                                value={newAsset.principal}
                                onChange={(e) => setNewAsset({ ...newAsset, principal: e.target.value })}
                                className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs"
                              />
                            </div>
                          )}
                          <div className={resolvedIsLiab ? 'col-span-2' : ''}>
                            <label className="block text-[11px] font-bold text-slate-600 mb-1">評価額・残高 (円)</label>
                            <input
                              type="number"
                              placeholder="例: 1500000"
                              value={newAsset.amount}
                              onChange={(e) => setNewAsset({ ...newAsset, amount: e.target.value })}
                              className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold"
                              required
                            />
                          </div>
                        </div>

                        <div className="flex space-x-2 pt-2">
                          <button
                            type="button"
                            onClick={() => setModalType(null)}
                            className="flex-1 bg-slate-100 py-2.5 rounded-xl text-xs font-bold"
                          >
                            閉じる
                          </button>
                          <button
                            type="submit"
                            onClick={() => {
                              if (useNewAccForm && !isCreatingInlineAccount) {
                                setIsCreatingInlineAccount(true);
                              }
                            }}
                            className="flex-1 bg-indigo-600 text-white py-2.5 rounded-xl text-xs font-bold"
                          >
                            追加する
                          </button>
                        </div>
                      </>
                    );
                  })()}
                </form>
              </div>
            </div>
          )}

          {/* 過去総資産スナップショット追加モーダル */}
          {modalType === 'history' && (
            <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-2xl max-w-sm w-full p-5 shadow-xl">
                <h3 className="text-base font-bold text-slate-900 mb-3">過去の総資産実績を追加</h3>
                <form onSubmit={handleAddHistory} className="space-y-3">
                  <input
                    type="text"
                    placeholder="時期ラベル (例: 2022年)"
                    value={newHistory.label}
                    onChange={(e) => setNewHistory({ ...newHistory, label: e.target.value })}
                    className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-sm"
                    required
                  />
                  <input
                    type="number"
                    min="1"
                    max="30"
                    placeholder="何年前ですか？"
                    value={newHistory.yearsAgo}
                    onChange={(e) => setNewHistory({ ...newHistory, yearsAgo: e.target.value })}
                    className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-sm"
                    required
                  />
                  <input
                    type="number"
                    placeholder="当時の総資産額 (円)"
                    value={newHistory.amount}
                    onChange={(e) => setNewHistory({ ...newHistory, amount: e.target.value })}
                    className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-sm"
                    required
                  />
                  <div className="flex space-x-2 pt-2">
                    <button type="button" onClick={() => setModalType(null)} className="flex-1 bg-slate-100 py-2.5 rounded-xl text-xs font-bold">
                      閉じる
                    </button>
                    <button type="submit" className="flex-1 bg-emerald-600 text-white py-2.5 rounded-xl text-xs font-bold">
                      記録を追加
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ライフイベント追加モーダル */}
          {modalType === 'event' && (
            <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-2xl max-w-sm w-full p-5 shadow-xl">
                <h3 className="text-base font-bold text-slate-900 mb-3">ライフイベントの追加</h3>
                <form onSubmit={handleAddEvent} className="space-y-3">
                  <input
                    type="text"
                    placeholder="イベント名"
                    value={newEvent.name}
                    onChange={(e) => setNewEvent({ ...newEvent, name: e.target.value })}
                    className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-sm"
                    required
                  />
                  <select
                    value={newEvent.type}
                    onChange={(e) => setNewEvent({ ...newEvent, type: e.target.value })}
                    className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-sm"
                  >
                    <option value="housing">マイホーム購入</option>
                    <option value="education">教育・進学費用</option>
                    <option value="car">自動車買い替え</option>
                    <option value="other">その他大型出費</option>
                  </select>
                  <div>
                    <label className="block text-[11px] font-bold text-slate-600 mb-1">発生時の年齢 (歳)</label>
                    <input
                      type="number"
                      value={newEvent.age}
                      onChange={(e) => setNewEvent({ ...newEvent, age: e.target.value })}
                      className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-sm"
                      required
                    />
                  </div>
                  {newEvent.type === 'housing' ? (
                    <>
                      <input
                        type="number"
                        placeholder="頭金・諸費用 (円)"
                        value={newEvent.downPayment}
                        onChange={(e) => setNewEvent({ ...newEvent, downPayment: e.target.value })}
                        className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-sm"
                      />
                      <input
                        type="number"
                        placeholder="住宅ローン月額返済 (円)"
                        value={newEvent.monthlyLoanPayment}
                        onChange={(e) => setNewEvent({ ...newEvent, monthlyLoanPayment: e.target.value })}
                        className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-sm"
                      />
                    </>
                  ) : (
                    <input
                      type="number"
                      placeholder="必要予算・支出合計 (円)"
                      value={newEvent.cost}
                      onChange={(e) => setNewEvent({ ...newEvent, cost: e.target.value })}
                      className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-sm"
                      required
                    />
                  )}
                  <div className="flex space-x-2 pt-2">
                    <button type="button" onClick={() => setModalType(null)} className="flex-1 bg-slate-100 py-2.5 rounded-xl text-xs font-bold">
                      閉じる
                    </button>
                    <button type="submit" className="flex-1 bg-indigo-600 text-white py-2.5 rounded-xl text-xs font-bold">
                      追加する
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <!-- PWA Service Worker 登録（相対パス指定・更新時自動リロード連携） -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker
          .register('./sw.js', { scope: './' })
          .then((reg) => {
            reg.update();
          })
          .catch((err) => {
            console.warn('Service Worker registration failed:', err);
          });
      });
    }
  </script>
</body>
</html>
